name: vp147-mutants

# VP-147 mutation evidence (S-25.08 T-12, D-1252-OWED): re-runs the checked-in
# mutants (crates/vp147-mutants/mutants.toml) against isolated git worktrees
# and requires every one to be KILLED by its Kani harness(es) / black-box
# tests. workflow_dispatch ONLY: each Kani mutant costs ~20 min of CBMC solve
# time, so this is deliberately NOT part of the per-PR gate (the per-PR gate
# is kani.yml, which proves the unmutated harnesses). Run it at the formal-
# hardening re-verification gate (T-6/T-12) or after editing the OBL-1 proofs.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated mutant ids to run (empty = all), e.g. M3,M5"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: vp147-mutants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutants:
    name: vp147 mutants (KILLED required)
    runs-on: ubuntu-latest
    # Timeout budget (NB-5/N-5). mutants.toml carries 6 mutants (M1, M2, M3,
    # M4-model, M4-production, M5) and the runner gives each its own wall-clock
    # cap (--timeout-secs 2700 below), so the worst case is
    #   6 x 2700 s = 16200 s = 270 min of mutants
    # plus ~30 min for toolchain/Kani install, cache restore and the release
    # builds = 300 min. The job timeout MUST exceed that, otherwise GitHub
    # kills the job before the runner can classify a slow mutant INVALID and
    # print its summary (the old 180 min was below 270). The per-mutant cap is
    # kept at 2700 s (>2x the ~20 min Kani solve) so a hung solver is still
    # reported per-mutant rather than burning the whole job; typical runs
    # finish in ~2 h. 300 min is under GitHub's 360 min hosted-runner ceiling.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Cache Kani toolchain + solver bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: kani-verifier-0.68.0-${{ runner.os }}

      - name: Install Kani
        run: |
          set -euo pipefail
          if ! cargo kani --version 2>/dev/null | grep -q '0.68.0'; then
            cargo install --locked kani-verifier@0.68.0
          fi
          cargo kani setup
          cargo kani --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: vp147-mutants

      - name: Validate mutant spec (each find text matches exactly once)
        run: |
          set -euo pipefail
          cargo run --release -p vp147-mutants -- --check-spec

      - name: Run VP-147 mutants
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          ARGS=()
          IFS=',' read -r -a IDS <<< "${ONLY}"
          for id in "${IDS[@]}"; do
            id="${id// /}"
            if [ -n "${id}" ]; then ARGS+=(--only "${id}"); fi
          done
          cargo build --release -p vp147-mutants
          # Per-mutant wall-clock budget (CR-012c): a Kani mutant is ~20 min, so
          # 2700 s (45 min) kills a hung solver's whole process group and
          # reports that mutant INVALID instead of burning the job timeout.
          # Keep 6 x 2700 s + ~30 min overhead < timeout-minutes (see above).
          ./target/release/vp147-mutants --timeout-secs 2700 "${ARGS[@]}" 2>&1 | tee vp147-mutants.log

      - name: Upload mutant logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: vp147-mutants-logs
          path: |
            vp147-mutants.log
            target/vp147-mutants/logs/*.log
          if-no-files-found: warn
