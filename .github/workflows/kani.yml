name: kani

# OBL-1 (D-1232-OBL-1) formal-verification gate: runs the Kani model-checking
# harnesses for the B2 BC-INDEX shard-migration crash-recovery state machine
# (crates/factory-dispatcher/src/shard_manager/obl1_kani_proofs.rs).
#
# Kani is a heavyweight bounded model checker (bundles its own nightly Rust
# toolchain + the CBMC/cadical solver via `cargo kani setup`), so it runs as
# its own job rather than inside the main `ci` cargo-host matrix. The harnesses
# are `#[cfg(kani)]`-gated and never compile in a normal build, so this job is
# the ONLY place they are exercised — a reviewer confirms the proofs here.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to conserve CI minutes (Kani solves
# are CPU-bound).
concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    name: kani (OBL-1 crash-recovery proofs)
    runs-on: ubuntu-latest
    # The ten OBL-1 harnesses (VP-147 v1.18 re-baseline, S-25.08 AC-010).
    # Solve times are recorded in the S-25.08 T-5 report; the recover-based
    # ones mem::forget their String-heavy records to skip CBMC's drop-glue
    # modeling (see obl1_kani_proofs.rs's "Solve-time note"). This budget is
    # a margin over the ~15 min local solve total (h4b alone ~10 min, ~3 GB
    # RSS) plus Kani install + crate compile on a slower hosted runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # kani-verifier 0.68.0 bundles nightly-2026-08-21 (rustc 1.100.0-nightly),
      # which is >= the workspace MSRV (1.95) — required, because `cargo kani`
      # resolves the full workspace graph (including crates that pin
      # rust-version = "1.95") and would otherwise be rejected by cargo's MSRV
      # gate. Keep this version >= the workspace MSRV whenever it is bumped.
      - name: Cache Kani toolchain + solver bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: kani-verifier-0.68.0-${{ runner.os }}

      - name: Install Kani
        run: |
          set -euo pipefail
          if ! cargo kani --version 2>/dev/null | grep -q '0.68.0'; then
            cargo install --locked kani-verifier@0.68.0
          fi
          cargo kani setup
          cargo kani --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: kani

      # Run EXACTLY the ten OBL-1 harnesses (VP-147), pinned by fully-
      # qualified name with `--exact`. This replaces the former
      # `--harness proof_obl1` SUBSTRING filter (adversary finding
      # F-C5-P3-001): a renamed/split/moved harness now makes its pinned name
      # match nothing and the per-name check below fails, instead of the
      # survivors silently going green. Each `#[kani::proof]` must report
      # VERIFICATION:- SUCCESSFUL; a counterexample is a real crash-recovery
      # or admission defect and fails the job. Do NOT weaken a harness to make
      # it pass -- route the failure to the implementer.
      #
      # Vacuity gate: every `kani::cover!` must be SATISFIED, and no check in
      # obl1_kani_proofs.rs may be UNREACHABLE -- either means an assumption
      # or a model change made a property trivially true (VP-147: INV-GATE-TXN
      # UNSAT-for-violation AND non-vacuity re-confirmed).
      - name: Run OBL-1 Kani proofs
        run: |
          set -euo pipefail

          PROOF_FILE=crates/factory-dispatcher/src/shard_manager/obl1_kani_proofs.rs
          HARNESSES=(
            shard_manager::obl1_kani_proofs::proof_obl1_h1_recover_totality
            shard_manager::obl1_kani_proofs::proof_obl1_h1_terminal_reconcile_totality
            shard_manager::obl1_kani_proofs::proof_obl1_h2_recovery_safety_predicate
            shard_manager::obl1_kani_proofs::proof_obl1_h3_transition_inductive_step
            shard_manager::obl1_kani_proofs::proof_obl1_h3_transition_bounded_sequence
            shard_manager::obl1_kani_proofs::proof_obl1_h4_admission_gate_invariant
            shard_manager::obl1_kani_proofs::proof_obl1_h4_reservation_quiescence_and_selfheal
            shard_manager::obl1_kani_proofs::proof_obl1_h5_pointer_swap_crash_atomicity
            shard_manager::obl1_kani_proofs::proof_obl1_h6_recovery_idempotence
            shard_manager::obl1_kani_proofs::proof_obl1_h6_terminal_reconcile_idempotence
          )
          # SIX logical obligations (h1..h6), TEN harnesses: h3 is split into
          # an inductive-step and a bounded-sequence proof, and the v1.18
          # re-baseline adds h1/h4/h6 harnesses over the shared admission and
          # terminal-reconciliation pure cores.
          EXPECTED_PROOFS=10
          if [ "${#HARNESSES[@]}" -ne "${EXPECTED_PROOFS}" ]; then
            echo "FAIL: ${#HARNESSES[@]} harnesses pinned but EXPECTED_PROOFS=${EXPECTED_PROOFS}."
            exit 1
          fi

          # A harness added to the proof file but not pinned above would be
          # silently skipped -- refuse that drift.
          DECLARED=$(grep -c '^#\[kani::proof\]' "${PROOF_FILE}" || true)
          if [ "${DECLARED}" -ne "${EXPECTED_PROOFS}" ]; then
            echo "FAIL: ${PROOF_FILE} declares ${DECLARED} #[kani::proof] harnesses but ${EXPECTED_PROOFS} are pinned in this job. Update HARNESSES and EXPECTED_PROOFS to match."
            exit 1
          fi

          HARNESS_ARGS=()
          for h in "${HARNESSES[@]}"; do
            HARNESS_ARGS+=(--harness "$h")
          done

          set +e
          cargo kani -p factory-dispatcher --exact "${HARNESS_ARGS[@]}" 2>&1 | tee kani-output.log
          KANI_EXIT="${PIPESTATUS[0]}"
          set -e

          SUCCESS_COUNT=$(grep -c 'VERIFICATION:- SUCCESSFUL' kani-output.log || true)
          BAD_COUNT=$(grep -cE 'VERIFICATION:- (FAILED|UNDETERMINED)' kani-output.log || true)

          echo "cargo kani exit code: ${KANI_EXIT}"
          echo "Successful proofs:    ${SUCCESS_COUNT} (expected ${EXPECTED_PROOFS})"
          echo "Failed/undetermined:  ${BAD_COUNT}"

          if [ "${KANI_EXIT}" -ne 0 ]; then
            echo "FAIL: cargo kani exited non-zero (${KANI_EXIT})."
            exit 1
          fi
          if [ "${BAD_COUNT}" -ne 0 ]; then
            echo "FAIL: ${BAD_COUNT} OBL-1 harness(es) reported FAILED or UNDETERMINED."
            exit 1
          fi
          if [ "${SUCCESS_COUNT}" -ne "${EXPECTED_PROOFS}" ]; then
            echo "FAIL: expected ${EXPECTED_PROOFS} successful OBL-1 proofs but ${SUCCESS_COUNT} succeeded."
            exit 1
          fi
          for h in "${HARNESSES[@]}"; do
            if ! grep -qF "Checking harness ${h}..." kani-output.log; then
              echo "FAIL: pinned harness ${h} did not run (renamed or moved?)."
              exit 1
            fi
          done

          # Vacuity gate 1: every cover property satisfied, in every harness.
          UNSAT_COVERS=$(awk '/cover properties satisfied/ { if ($2 != $4) bad++ } END { print bad + 0 }' kani-output.log)
          COVER_SUMMARIES=$(grep -c 'cover properties satisfied' kani-output.log || true)
          if [ "${UNSAT_COVERS}" -ne 0 ] || [ "${COVER_SUMMARIES}" -ne "${EXPECTED_PROOFS}" ]; then
            echo "FAIL: ${UNSAT_COVERS} harness(es) have an unsatisfied kani::cover! (or a harness lost its covers: ${COVER_SUMMARIES} cover summaries for ${EXPECTED_PROOFS} harnesses) -- a vacuous proof."
            exit 1
          fi
          # Vacuity gate 2: no UNREACHABLE check located in the proof file.
          UNREACHABLE_IN_PROOFS=$(awk -v f="${PROOF_FILE}" '
            /Status: UNREACHABLE/ { pending = 1; next }
            pending && /Location:/ { if (index($0, f) > 0) bad++; pending = 0 }
            END { print bad + 0 }' kani-output.log)
          if [ "${UNREACHABLE_IN_PROOFS}" -ne 0 ]; then
            echo "FAIL: ${UNREACHABLE_IN_PROOFS} check(s) in ${PROOF_FILE} are UNREACHABLE -- a vacuous assertion."
            exit 1
          fi

          echo "PASS: all ${EXPECTED_PROOFS} OBL-1 harnesses verified successfully, all covers satisfied."
