name: kani

# OBL-1 (D-1232-OBL-1) formal-verification gate: runs the Kani model-checking
# harnesses for the B2 BC-INDEX shard-migration crash-recovery state machine
# (crates/factory-dispatcher/src/shard_manager/obl1_kani_proofs.rs).
#
# Kani is a heavyweight bounded model checker (bundles its own nightly Rust
# toolchain + the CBMC/cadical solver via `cargo kani setup`), so it runs as
# its own job rather than inside the main `ci` cargo-host matrix. The harnesses
# are `#[cfg(kani)]`-gated and never compile in a normal build, so this job is
# the ONLY place they are exercised — a reviewer confirms the proofs here.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to conserve CI minutes (Kani solves
# are CPU-bound).
concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    name: kani (OBL-1 crash-recovery proofs)
    runs-on: ubuntu-latest
    # All seven OBL-1 harnesses solve in well under a minute each (the
    # recover-based ones mem::forget their String-heavy records to skip
    # CBMC's drop-glue modeling — see obl1_kani_proofs.rs's "Solve-time
    # note"). This budget is a generous margin over the ~2 min of solving
    # plus Kani install + crate compile.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # kani-verifier 0.68.0 bundles nightly-2026-08-21 (rustc 1.100.0-nightly),
      # which is >= the workspace MSRV (1.95) — required, because `cargo kani`
      # resolves the full workspace graph (including crates that pin
      # rust-version = "1.95") and would otherwise be rejected by cargo's MSRV
      # gate. Keep this version >= the workspace MSRV whenever it is bumped.
      - name: Cache Kani toolchain + solver bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: kani-verifier-0.68.0-${{ runner.os }}

      - name: Install Kani
        run: |
          set -euo pipefail
          if ! cargo kani --version 2>/dev/null | grep -q '0.68.0'; then
            cargo install --locked kani-verifier@0.68.0
          fi
          cargo kani setup
          cargo kani --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: kani

      # Run every OBL-1 crash-recovery harness (substring match on the shared
      # `proof_obl1` prefix). Each `#[kani::proof]` must report VERIFICATION:-
      # SUCCESSFUL; a counterexample (VERIFICATION:- FAILED) is a real
      # crash-recovery defect and fails the job. Do NOT weaken a harness to make
      # it pass — a failure is a finding to route to the implementer.
      #
      # `--harness proof_obl1` is a SUBSTRING filter, not an exact-name pin
      # (adversary finding F-C5-P3-001). If a future refactor renames, splits,
      # or moves an OBL-1 harness so it no longer contains the `proof_obl1`
      # prefix, Kani silently verifies only the survivors, prints
      # "N successfully verified, 0 failures", and exits 0 GREEN — a
      # false-green on a real partial-regression. (A *zero*-match filter does
      # make Kani error; a *partial*-match filter does not.) Guard against
      # this by asserting the full expected proof count ran and succeeded,
      # independent of Kani's own exit code.
      - name: Run OBL-1 Kani proofs
        run: |
          set -euo pipefail

          EXPECTED_PROOFS=7

          set +e
          cargo kani -p factory-dispatcher --harness proof_obl1 2>&1 | tee kani-output.log
          KANI_EXIT="${PIPESTATUS[0]}"
          set -e

          SUCCESS_COUNT=$(grep -c 'VERIFICATION:- SUCCESSFUL' kani-output.log || true)
          BAD_COUNT=$(grep -cE 'VERIFICATION:- (FAILED|UNDETERMINED)' kani-output.log || true)

          echo "cargo kani exit code: ${KANI_EXIT}"
          echo "Successful proofs:    ${SUCCESS_COUNT} (expected ${EXPECTED_PROOFS})"
          echo "Failed/undetermined:  ${BAD_COUNT}"

          if [ "${KANI_EXIT}" -ne 0 ]; then
            echo "FAIL: cargo kani exited non-zero (${KANI_EXIT})."
            exit 1
          fi
          if [ "${BAD_COUNT}" -ne 0 ]; then
            echo "FAIL: ${BAD_COUNT} OBL-1 harness(es) reported FAILED or UNDETERMINED."
            exit 1
          fi
          if [ "${SUCCESS_COUNT}" -ne "${EXPECTED_PROOFS}" ]; then
            echo "FAIL: expected ${EXPECTED_PROOFS} successful OBL-1 proofs but only ${SUCCESS_COUNT} ran. This means the --harness proof_obl1 substring filter no longer matches the full harness set (a harness was renamed, split, or moved out of the crate) -- a silent partial-verification false-green. If the harness count intentionally changed, update EXPECTED_PROOFS here to match."
            exit 1
          fi

          echo "PASS: all ${EXPECTED_PROOFS} OBL-1 harnesses verified successfully."

  kani-mechanism-a:
    name: kani (mechanism-A crash-recovery proofs)
    runs-on: ubuntu-latest
    # The seven mechanism-A harnesses (S-25.06 / BC-1.18.013) solve in ~3 min
    # total locally (a5's crash-model sweep ~150 s, every other harness < 2 s
    # of solver time; ~162 s wall for the whole pinned set): the
    # decision-based ones (a1/a2/a5/a6) stub `std::fmt::format` (see
    # append_log_kani_proofs.rs's `stub_format` doc comment — unstubbed, a1
    # alone ran >16 min at 12 GB RSS) and mem::forget their String-heavy
    # values; a3/a4 are allocation-free. Same generous margin as the B2 gate.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # kani-verifier 0.68.0 bundles nightly-2026-08-21 (rustc 1.100.0-nightly),
      # which is >= the workspace MSRV (1.95) — required, because `cargo kani`
      # resolves the full workspace graph (including crates that pin
      # rust-version = "1.95") and would otherwise be rejected by cargo's MSRV
      # gate. Keep this version >= the workspace MSRV whenever it is bumped.
      - name: Cache Kani toolchain + solver bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: kani-verifier-0.68.0-${{ runner.os }}

      - name: Install Kani
        run: |
          set -euo pipefail
          if ! cargo kani --version 2>/dev/null | grep -q '0.68.0'; then
            cargo install --locked kani-verifier@0.68.0
          fi
          cargo kani setup
          cargo kani --version

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: kani-mechanism-a

      # Run EXACTLY the seven mechanism-A crash-recovery harnesses, pinned by
      # fully-qualified name with `--exact` (stronger than the B2 job's
      # substring filter: a renamed/moved harness makes its pinned name match
      # nothing and the per-name check below fails, instead of the survivors
      # silently going green — adversary finding F-C5-P3-001's false-green
      # class). Each `#[kani::proof]` must report VERIFICATION:- SUCCESSFUL; a
      # counterexample is a real crash-recovery defect and fails the job. Do
      # NOT weaken a harness to make it pass — route the failure to the
      # implementer.
      #
      # `-Z stubbing` enables the `#[kani::stub(std::fmt::format, ...)]`
      # attributes on a1/a2/a5/a6 (required for tractability; see above).
      #
      # Vacuity gate: every `kani::cover!` must be SATISFIED, and no assertion
      # in append_log_kani_proofs.rs may be UNREACHABLE — either means an
      # assumption or a model change made a property trivially true.
      - name: Run mechanism-A Kani proofs
        run: |
          set -euo pipefail

          PROOF_FILE=crates/factory-dispatcher/src/shard_manager/append_log_kani_proofs.rs
          HARNESSES=(
            shard_manager::append_log_kani_proofs::proof_obl_a1_recover_totality
            shard_manager::append_log_kani_proofs::proof_obl_a2_recovery_safety_predicate
            shard_manager::append_log_kani_proofs::proof_obl_a3_transition_inductive_step
            shard_manager::append_log_kani_proofs::proof_obl_a3_transition_bounded_sequence
            shard_manager::append_log_kani_proofs::proof_obl_a4_admission_gate_invariant
            shard_manager::append_log_kani_proofs::proof_obl_a5_pointer_swap_and_move_crash_atomicity
            shard_manager::append_log_kani_proofs::proof_obl_a6_recovery_idempotence
          )
          # SIX logical obligations (a1..a6), SEVEN harnesses: a3 is split into
          # an inductive-step proof and a bounded-sequence proof, exactly as
          # the B2 OBL-1 gate above splits its own item 3.
          EXPECTED_PROOFS=${#HARNESSES[@]}

          # A harness added to the proof file but not pinned above would be
          # silently skipped — refuse that drift.
          DECLARED=$(grep -c '^#\[kani::proof\]' "${PROOF_FILE}" || true)
          if [ "${DECLARED}" -ne "${EXPECTED_PROOFS}" ]; then
            echo "FAIL: ${PROOF_FILE} declares ${DECLARED} #[kani::proof] harnesses but ${EXPECTED_PROOFS} are pinned in this job. Update HARNESSES to match."
            exit 1
          fi

          HARNESS_ARGS=()
          for h in "${HARNESSES[@]}"; do
            HARNESS_ARGS+=(--harness "$h")
          done

          set +e
          cargo kani -p factory-dispatcher -Z stubbing --exact "${HARNESS_ARGS[@]}" 2>&1 | tee kani-mechanism-a-output.log
          KANI_EXIT="${PIPESTATUS[0]}"
          set -e

          SUCCESS_COUNT=$(grep -c 'VERIFICATION:- SUCCESSFUL' kani-mechanism-a-output.log || true)
          BAD_COUNT=$(grep -cE 'VERIFICATION:- (FAILED|UNDETERMINED)' kani-mechanism-a-output.log || true)

          echo "cargo kani exit code: ${KANI_EXIT}"
          echo "Successful proofs:    ${SUCCESS_COUNT} (expected ${EXPECTED_PROOFS})"
          echo "Failed/undetermined:  ${BAD_COUNT}"

          if [ "${KANI_EXIT}" -ne 0 ]; then
            echo "FAIL: cargo kani exited non-zero (${KANI_EXIT})."
            exit 1
          fi
          if [ "${BAD_COUNT}" -ne 0 ]; then
            echo "FAIL: ${BAD_COUNT} mechanism-A harness(es) reported FAILED or UNDETERMINED."
            exit 1
          fi
          if [ "${SUCCESS_COUNT}" -ne "${EXPECTED_PROOFS}" ]; then
            echo "FAIL: expected ${EXPECTED_PROOFS} successful mechanism-A proofs but ${SUCCESS_COUNT} succeeded."
            exit 1
          fi
          for h in "${HARNESSES[@]}"; do
            if ! grep -qF "Checking harness ${h}..." kani-mechanism-a-output.log; then
              echo "FAIL: pinned harness ${h} did not run (renamed or moved?)."
              exit 1
            fi
          done

          # Vacuity gate 1: every cover property satisfied, in every harness.
          UNSAT_COVERS=$(awk '/cover properties satisfied/ { if ($2 != $4) bad++ } END { print bad + 0 }' kani-mechanism-a-output.log)
          COVER_SUMMARIES=$(grep -c 'cover properties satisfied' kani-mechanism-a-output.log || true)
          if [ "${UNSAT_COVERS}" -ne 0 ] || [ "${COVER_SUMMARIES}" -ne "${EXPECTED_PROOFS}" ]; then
            echo "FAIL: ${UNSAT_COVERS} harness(es) have an unsatisfied kani::cover! (or a harness lost its covers: ${COVER_SUMMARIES} cover summaries for ${EXPECTED_PROOFS} harnesses) -- a vacuous proof."
            exit 1
          fi
          # Vacuity gate 2: no UNREACHABLE check located in the proof file.
          UNREACHABLE_IN_PROOFS=$(awk -v f="${PROOF_FILE}" '
            /Status: UNREACHABLE/ { pending = 1; next }
            pending && /Location:/ { if (index($0, f) > 0) bad++; pending = 0 }
            END { print bad + 0 }' kani-mechanism-a-output.log)
          if [ "${UNREACHABLE_IN_PROOFS}" -ne 0 ]; then
            echo "FAIL: ${UNREACHABLE_IN_PROOFS} check(s) in ${PROOF_FILE} are UNREACHABLE -- a vacuous assertion."
            exit 1
          fi

          echo "PASS: all ${EXPECTED_PROOFS} mechanism-A harnesses verified successfully, all covers satisfied."
