# Every method file (<plugin>/methods/<name>.md) and the agent that owns it.
#
# Sources: agents-skills.md#2.8, pipeline.md#2.9.13, BLUEPRINT.md#4.4
# Built by package B6. The assignment of methods to the steps of every
# workflow is the table step-methods; one step takes one method, and the
# universal test 6 checks that the method exists and the agent file lists it.
# Shared files are listed once, with every owner. There is no wave-plan and
# no release method; the clerk has none.

[[method]]
name = "domain-spec"
owner = ["product-owner"]
description = "Also the project context after an ingest."

[[method]]
name = "requirements"
owner = ["product-owner"]
description = "Contracts, error taxonomy, interfaces, non-functional requirements, module criticality, revision after feasibility review."

