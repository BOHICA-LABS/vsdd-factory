description = "Fixing findings of category `test` or `coverage`: strengthening a test that cannot fail, adding the test for an uncovered criterion; it ends with `vsdd gate red --refreeze` and then runs the green gate, whose result it returns whether or not it passes: a strengthened test that fails on the current code is re-frozen, and the implementer makes it pass."

