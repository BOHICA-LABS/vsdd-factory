# The provisional agent names of BLUEPRINT.md#4.4, and the roster agent and
# method that replace each. Every workflow uses roster names, and each step names
# a method file. agent and method are arrays; a cell that carries a qualifier keeps
# it inside its one element.

[[replaced-name]]
pipeline_design_name = "business-analyst (domain stage of `spec`; project context in `ingest` and `multi`)"
agent = ["product-owner"]
method = ["domain-spec"]

[[replaced-name]]
pipeline_design_name = "business-analyst (synthesis and idea briefs in `discover`; assessment)"
agent = ["researcher"]
method = ["discovery", "market-intel"]

[[replaced-name]]
pipeline_design_name = "business-analyst (risks and assumptions sweep)"
agent = ["researcher"]
method = ["risk-sweep"]

[[replaced-name]]
pipeline_design_name = "research-agent"
agent = ["researcher"]
method = ["research", "market-intel", "discovery"]

[[replaced-name]]
pipeline_design_name = "data-engineer"
agent = ["implementer"]
method = ["data-migration"]

[[replaced-name]]
pipeline_design_name = "devops-engineer, dx-engineer"
agent = ["devops (inside chore stories)"]
method = ["ci", "repo-setup", "toolchain"]

[[replaced-name]]
pipeline_design_name = "formal-verifier, performance-engineer, dtu-validator"
agent = ["verifier (inside harness stories; the measuring itself is the formal, perf and clone-fidelity checks of vsdd gate release and vsdd gate wave, run by a clerk)"]
method = ["proofs", "fuzzing", "mutation", "performance", "clone-fidelity"]

[[replaced-name]]
pipeline_design_name = "e2e-tester (`ui-verify`)"
agent = ["the ui check inside vsdd gate wave and vsdd gate release (the tests are written by test-writer)"]
method = ["e2e-tests"]

[[replaced-name]]
pipeline_design_name = "spec-reviewer"
agent = ["adversary (for specifications and stories)", "scenario-reviewer (for hidden scenarios)"]
method = ["review-specs", "review-stories", "review-scenarios"]

[[replaced-name]]
pipeline_design_name = "validate-extraction"
agent = ["adversary"]
method = ["review-extraction"]

[[replaced-name]]
pipeline_design_name = "accessibility-auditor, visual-reviewer"
agent = ["ui-reviewer"]
