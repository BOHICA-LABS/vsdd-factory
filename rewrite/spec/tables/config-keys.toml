# sources: state.md#2.12, BLUEPRINT.md#4.12, hooks.md#2.6, state.md#2.14
# Every section and key of factory.toml with its type, default and owner; an unknown key is an error.
# The annotated example that is the whole key list is in topic:project-configuration. Owners: the state
# design owns schema, project, branches, commands, paths, state, caps, component, reference and repo; the
# pipeline design owns delivery, convergence, holdout, mutation, limits, stops, evidence, notify, maintain,
# release and discover; the pipeline and hooks designs own spikes; the hooks design owns hooks. A key
# without a meaning has none in the originals.

