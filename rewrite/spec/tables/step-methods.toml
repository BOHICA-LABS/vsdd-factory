# The agent and method of every step of every workflow; the table the scripts are written from.
# Sources: pipeline.md#2.9.13, BLUEPRINT.md#4.14.
# step() takes a required `method`, and universal test 6 checks that the method exists and that the
# step's agent file lists it. Clerk steps have no method. Where a stage has more than one agent step,
# each is listed. Rows whose `note` says "positional" pair agents[n] with methods[n].
# Methods with no pairing of their own are grouped in the note, as in the source table.
# Outside the workflows, the `brief` skill uses `brief` (product-owner) and the `author` skill uses
# `conventions` (architect). `stubs` is merged into `failing-tests`, because one step takes one method.

[[step]]
workflow = "story"
stage = "tests"
agents = ["test-writer"]
methods = []
note = "By story kind: failing-tests (feature; it includes the stubs), regression-test (fix), equivalence-tests (port); ui-tests or e2e-tests when the story's tests_method key says so. No tests stage for facade, docs, chore, harness"

[[step]]
workflow = "story"
stage = "implement"
agents = []
methods = []
note = "By story kind: tdd (implementer, feature), fix-findings (implementer, fix), port-translation (implementer, port), service-clone (implementer, facade), docs (technical-writer, docs), repo-setup, ci or toolchain (devops, chore), proofs, fuzzing, mutation, performance or clone-fidelity (verifier, harness); or the story's impl_method key"

[[step]]
workflow = "story"
stage = "review"
agents = ["adversary", "security-reviewer"]
methods = ["review-story-diff", "security-review"]
note = "positional"

[[step]]
