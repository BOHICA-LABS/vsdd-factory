# hooks-registry-nospace-fixture.toml
# Fixture for S-21.09 AC-006 T-013 (BLOCKER-1 nospace mutant test).
#
# Declares ghost-guard-nospace.wasm using the no-space-around-equals form:
#   plugin="hook-plugins/ghost-guard-nospace.wasm"
# This is TOML-legal (the spec allows whitespace around `=` to be optional)
# and was accepted by the real dispatcher (sync_plugins=1, plugins_run=1,
# exit_code=0) but missed by the v1 parse_plugin_refs() line-scanner, which
# required the exact literal `plugin = ` (one space on each side of `=`).
#
# Used by T-013 to prove that parse_plugin_refs() (toml-crate version) extracts
# ghost-guard-nospace.wasm into the declared set, closing BLOCKER-1 false-negative.
#
# Story: S-21.09
schema_version = 2

[[hooks]]
name = "ghost-guard-nospace"
event = "PreToolUse"
tool = "^Bash$"
plugin="hook-plugins/ghost-guard-nospace.wasm"
timeout_ms = 5000
on_error = "continue"
