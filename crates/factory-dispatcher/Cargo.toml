[package]
name = "factory-dispatcher"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "vsdd-factory v1.0 dispatcher binary — routes Claude Code hook events to WASM plugins"
publish = false

[[bin]]
name = "factory-dispatcher"
path = "src/main.rs"

[lib]
name = "factory_dispatcher"
path = "src/lib.rs"

[features]
# test-support: enables VSDD_ASYNC_DRAIN_WINDOW_MS env-override in release builds.
# Sole wired consumer: ci.yml build-dispatcher matrix "Test (cargo)" step
# (cargo test --release --features factory-dispatcher/test-support), which runs the
# bc_3_08_001_s19_05 integration tests with a generous drain window to accommodate
# WASM cold-start time. The bats-full-suite release binary (ci.yml bats-full-suite
# job "Build factory-dispatcher" step) is built WITHOUT this feature and uses the
# hardcoded ASYNC_DRAIN_WINDOW_MS = 100 ms.
# DI-019 v1.6 preserved: release.yml builds factory-dispatcher WITHOUT this feature
# so shipped artifacts always use ASYNC_DRAIN_WINDOW_MS = 100 ms.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# S-25.02 BC-1.18.005 Postcondition 8: `shard_manager::read_changelog_item_count`
# parses a `[[shard]]`-registered artifact's frontmatter `changelog:` sequence
# to count its items. `serde_norway` is already a workspace dependency (used
# by `factory-lock-parse`, `last-amended-migrate`, `vsdd-context-resolvers`);
# this is the same general-purpose-YAML-on-a-bounded-frontmatter-block usage
# pattern `last-amended-migrate/src/yaml_guard.rs` documents for its own
# `MinimalFrontmatter`/`ChangelogOnly` structs — never the hand-rolled
# unbounded-single-scalar-line scan `factory-lock-parse`/`frontmatter.rs` use
# for a different (unrelated) bounded-resource reason.
serde_norway.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
regex.workspace = true
chrono.workspace = true
# S-25.02 BC-1.18.008 v1.6 F-C3-P6-001: SHA-256 hashing for the Backfill
# Recovery Manifest / Postcondition 5 Recovery-Confirmation Rule (see
# workspace Cargo.toml's `sha2` entry for the full justification).
sha2.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
tokio.workspace = true
tracing.workspace = true
# S-25.02 BC-1.18.005: `shard_manager` reuses the canonical `HookResult`
# three-variant contract (Continue/Block/Error) rather than inventing a
# parallel result type for the native shard-cap gate check.
vsdd-hook-sdk = { path = "../hook-sdk" }
# S-25.02 BC-1.18.006 (cluster-2, roll-before-write): the staged roll
# sequence's steps (c)-(d) (atomic-truncate canonical, publish shard-index)
# reuse `write_atomic`'s existing temp-file-then-rename primitive verbatim
# (BC-1.18.006 Architecture Anchors; no new atomic-write primitive is
# introduced for THOSE two steps). CORRECTED (MINOR-6, PR #824 pr-review
# cycle 3): step (b) (`publish_sealed_shard`) does NOT reuse `write_atomic`
# — it uses a purpose-built `write_exclusive`/`stage_temp_file` +
# `publish_staged_temp_file` pair over `OpenOptions::create_new` +
# `hard_link` + a local `random_nonce()`, deliberately NOT `rename(2)`,
# because `rename` clobbers an existing destination and this path must be
# write-once (a sealed shard must never silently overwrite prior sealed
# history). The dependency below is still justified by steps (c)/(d)
# alone; step (b)'s own write-once primitive needs no new dependency
# either. `factory-dispatcher` -> `last-amended-migrate` is the ONLY
# allowed direction of this workspace-internal edge (ADR-051 §8
# dependency-acyclicity check; story S-25.02 Architecture Compliance Rules
# "Forbidden dependency" row) — `last-amended-migrate` MUST NOT gain a
# reverse dependency on `factory-dispatcher`.
#
# NIT-5 (PR #824 pr-review cycle 3): `last-amended-migrate` is a
# `clap`-based operator CLI crate; taking it as a normal (non-dev)
# dependency here pulls `clap` into `factory-dispatcher`'s own build graph
# for one ~40-line `write_atomic` helper. ACCEPTED as-is: `clap` is already
# a workspace dependency (no new external crate, `Cargo.lock` unaffected
# beyond this one edge), the unused CLI surface is linker-dropped from the
# shipped binary, and CI/lock impact is nil. Hoisting `write_atomic` into a
# leaf crate both `factory-dispatcher` and `last-amended-migrate` could
# depend on would be the architecturally cleaner edge, but is not
# justified purely to shave an already-workspace-resident dependency off
# one crate's build graph; revisit only if `last-amended-migrate` grows
# additional CLI-only dependencies that make the asymmetry more costly.
last-amended-migrate = { path = "../last-amended-migrate", version = "0.0.1" }
factory-lock-parse = { path = "../factory-lock-parse", version = "0.0.1" }
sink-core = { path = "../sink-core", version = "0.0.1" }
sink-datadog = { path = "../sink-datadog", version = "0.0.1" }
sink-file = { path = "../sink-file", version = "0.0.1" }
sink-honeycomb = { path = "../sink-honeycomb", version = "0.0.1" }
sink-http = { path = "../sink-http", version = "0.0.1" }
sink-otel-grpc = { path = "../sink-otel-grpc", version = "0.0.1" }

[dev-dependencies]
tempfile.workspace = true
filetime.workspace = true
wat.workspace = true
# Mock OTLP receiver for the sinks_otel_grpc integration test (S-1.9).
# We pull in tokio + tonic + the same proto crate the sink uses so the
# mock and the real client share message types verbatim.
tokio.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
opentelemetry-proto.workspace = true
# S-4.07 integration tests: mock HTTP server for datadog/honeycomb/http sinks.
httpmock.workspace = true
# VP-075 proptest harness for resolver_determinism_proptest.rs (S-12.03).
proptest.workspace = true

[lints]
workspace = true
