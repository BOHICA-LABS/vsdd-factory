[package]
name = "precompact-flush"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Native WASM PreCompact hook plugin: commits STATE.md to factory-artifacts branch before compaction; renews factory lock natively (S-18.04a, ADR-028, BC-7.07.001)"
publish = false

# Hook plugins ship as WASI commands built via
# `cargo build --target wasm32-wasip1`. The [lib] target carries testable pure
# logic (state machine, log entry formatter, worktree parser, frontmatter reader).
# [[bin]] wraps the vsdd-hook-sdk trampoline entry point.
[lib]
path = "src/lib.rs"
# cdylib: required for WASM compilation (wasm32-wasip1 target).
# rlib: required for integration tests to link against the lib.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "precompact-flush"
path = "src/main.rs"

[dependencies]
vsdd-hook-sdk = { path = "../../hook-sdk" }
# factory-lock: identity-gated lock renewal (renew_lock_if_holder, classify_identity_resolution,
# RenewOutcome, SkipReason, IdentityResolution, LockError).
# Dependency direction: precompact-flush → factory-lock → factory-lock-parse (no cycles).
factory-lock = { path = "../../factory-lock" }
# chrono: UTC ISO-8601 timestamps for the log entry and commit message.
# Use chrono::Utc::now().format("%Y-%m-%dT%H:%M:%SZ") — NOT to_rfc3339() (AC-018 F-NW-008).
chrono = { workspace = true }

[dev-dependencies]
vsdd-hook-sdk = { path = "../../hook-sdk" }
serde_json = { workspace = true }

[lints]
workspace = true
