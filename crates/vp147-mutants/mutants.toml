# VP-147 mutant list (S-25.08 T-12, D-1252-OWED). Consumed by `vp147-mutants`.
#
# Each [[mutant]] is ONE source edit applied to a scratch git worktree at the
# base revision. `find` must occur EXACTLY once in `file` (multi-line literal
# strings below are byte-exact, including indentation and the trailing
# newline); `replace` is substituted for it. `expected` is always KILLED: the
# killer (named Kani harnesses, or cargo test targets) must fail against the
# mutated tree. Validate matches without building: `vp147-mutants --check-spec`.

[[mutant]]
id = "M1"
description = "foreign-migration check removed from the pure terminal-reconciliation core"
file = "crates/factory-dispatcher/src/shard_manager.rs"
find = '''
    if !inputs.txn_migration_known {
        return TerminalReconcileDecision::RefuseForeignMigration;
    }
'''
replace = '''
    // MUTANT M1: foreign-migration check removed
'''
expected = "KILLED"
killer = { kind = "kani", package = "factory-dispatcher", harnesses = [
  "shard_manager::obl1_kani_proofs::proof_obl1_h1_terminal_reconcile_totality",
  "shard_manager::obl1_kani_proofs::proof_obl1_h6_terminal_reconcile_idempotence",
] }

