# Artifact Path Registry — single source of truth for canonical .factory/ artifact locations.
# See ADR-016-artifact-path-registry-single-source-of-truth.md
#
# Schema version: 1
# enforcement_level values: block | warn | advisory
#   block    — this path pattern is the CANONICAL location; validate-artifact-path hook allows writes here
#   warn     — write proceeds but a hook.warn event is emitted
#   advisory — write proceeds with a log_debug advisory only
#
# Per OQ5 resolution: all entries ship with enforcement_level set to block.
# The hook always blocks writes to .factory/ paths that match NO entry (ARTIFACT_PATH_UNREGISTERED).
#
# Pattern syntax: {placeholder} matches any non-empty path segment or sequence.
# Example: ".factory/specs/behavioral-contracts/ss-{subsystem}/BC-{bc-id}.md"
#   matches: ".factory/specs/behavioral-contracts/ss-04/BC-4.11.001.md"

version: 1
artifacts:
  # ── Behavioral Contracts ─────────────────────────────────────────────────
  - artifact_type: behavioral-contract
    canonical_path_pattern: ".factory/specs/behavioral-contracts/ss-{subsystem}/BC-{bc-id}.md"
    description: Behavioral contract spec sharded by subsystem directory
    enforcement_level: block

  - artifact_type: behavioral-contract-index
    canonical_path_pattern: ".factory/specs/behavioral-contracts/BC-INDEX.md"
    description: Behavioral contract master index
    enforcement_level: block

  - artifact_type: behavioral-contract-id-mapping
    canonical_path_pattern: ".factory/specs/behavioral-contracts/bc-id-mapping.md"
    description: Behavioral contract ID allocation mapping
    enforcement_level: block

  # ── Architecture Decision Records ────────────────────────────────────────
  - artifact_type: adr
    canonical_path_pattern: ".factory/specs/architecture/decisions/ADR-{adr-id}-{slug}.md"
    description: Architecture decision record
    enforcement_level: block

  - artifact_type: architecture-index
    canonical_path_pattern: ".factory/specs/architecture/ARCH-INDEX.md"
    description: Architecture master index
    enforcement_level: block

  - artifact_type: architecture-subsystem-doc
    canonical_path_pattern: ".factory/specs/architecture/SS-{subsystem}-{slug}.md"
    description: Per-subsystem architecture document
    enforcement_level: block

  - artifact_type: verification-architecture
    canonical_path_pattern: ".factory/specs/architecture/verification-architecture.md"
    description: Verification architecture derived view (POLICY 9 propagation target from VP-INDEX)
    enforcement_level: block

  - artifact_type: verification-coverage-matrix
    canonical_path_pattern: ".factory/specs/architecture/verification-coverage-matrix.md"
    description: Verification coverage matrix derived view (POLICY 9 propagation target from VP-INDEX)
    enforcement_level: block

  # ── Verification Properties ──────────────────────────────────────────────
  - artifact_type: verification-property
    canonical_path_pattern: ".factory/specs/verification-properties/VP-{vp-id}.md"
    description: Verification property specification
    enforcement_level: block

  - artifact_type: verification-property-index
    canonical_path_pattern: ".factory/specs/verification-properties/VP-INDEX.md"
    description: Verification property master index
    enforcement_level: block

  # ── Stories ─────────────────────────────────────────────────────────────
  - artifact_type: story-spec
    canonical_path_pattern: ".factory/stories/S-{story-id}-{slug}.md"
    description: Story specification
    enforcement_level: block

  - artifact_type: story-index
    canonical_path_pattern: ".factory/stories/STORY-INDEX.md"
    description: Story master index
    enforcement_level: block

  - artifact_type: sprint-state
    canonical_path_pattern: ".factory/stories/sprint-state.yaml"
    description: Sprint state tracking file
    enforcement_level: block

  - artifact_type: story-id-mapping
    canonical_path_pattern: ".factory/stories/legacy-id-mapping.md"
    description: Legacy story ID mapping
    enforcement_level: block

  # ── Epics ────────────────────────────────────────────────────────────────
  - artifact_type: epic
    canonical_path_pattern: ".factory/stories/epics/E-{epic-id}-{slug}.md"
    description: Epic definition
    enforcement_level: block

  # ── Cycle Documents ──────────────────────────────────────────────────────
  - artifact_type: cycle-decision-log
    canonical_path_pattern: ".factory/cycles/{cycle-id}/decision-log.md"
    description: Per-cycle decision log
    enforcement_level: block

  - artifact_type: cycle-index
    canonical_path_pattern: ".factory/cycles/{cycle-id}/INDEX.md"
    description: Per-cycle index document
    enforcement_level: block

  - artifact_type: phase-delta-analysis
    canonical_path_pattern: ".factory/cycles/{cycle-id}/{phase}-delta-analysis.md"
    description: Phase delta analysis document (F1, F2, etc.)
    enforcement_level: block

  - artifact_type: cycle-document
    canonical_path_pattern: ".factory/cycles/{cycle-id}/{filename}.md"
    description: Generic cycle-level document
    enforcement_level: block

  - artifact_type: cycle-story-implementation
    canonical_path_pattern: ".factory/cycles/{cycle-id}/{story-id}/implementation/{filename}.md"
    description: Per-story implementation artifact (e.g. red-gate-log)
    enforcement_level: block

  - artifact_type: adversarial-review
    canonical_path_pattern: ".factory/cycles/{cycle-id}/adv-{slug}.md"
    description: Adversarial review document for a cycle
    enforcement_level: block

  - artifact_type: per-story-adversary-pass
    canonical_path_pattern: ".factory/cycles/{cycle-id}/{story-id}/adversary-pass-{n}.md"
    description: Per-story adversarial review pass file (BC-5.39.001)
    enforcement_level: block

  # ── Product Requirements / State ─────────────────────────────────────────
  - artifact_type: product-brief
    canonical_path_pattern: ".factory/specs/product-brief.md"
    description: L1 product brief written by skills/create-brief — root of the traces_to chain
    enforcement_level: block

  - artifact_type: prd
    canonical_path_pattern: ".factory/specs/prd.md"
    description: Product requirements document
    enforcement_level: block

  - artifact_type: prd-supplement
    canonical_path_pattern: ".factory/specs/prd-supplements/{slug}.md"
    description: >
      PRD supplement extracted from the monolithic PRD per DF-021 (interface-definitions.md,
      error-taxonomy.md, test-vectors.md, nfr-catalog.md). Producer: product-owner. Added
      S-25.02 F2 fix-burst (F-S2502-F2-006) closing a pre-existing gap — prd.md §5.1/§5b/§4/§3
      have referenced this directory since before this registry entry existed.
    enforcement_level: block

  - artifact_type: state
    canonical_path_pattern: ".factory/STATE.md"
    description: Pipeline state document
    enforcement_level: block

  - artifact_type: state-runtime-regression
    canonical_path_pattern: ".factory/regression-state.json"
    description: Regression gate runtime state file
    enforcement_level: block

  - artifact_type: state-runtime-adversary
    canonical_path_pattern: ".factory/cycles/{cycle-id}/{story-id}/adversary-convergence-state.json"
    description: Per-story adversary convergence runtime state file (BC-5.39.001 PC2)
    enforcement_level: block

  - artifact_type: state-runtime-wave
    canonical_path_pattern: ".factory/wave-state.yaml"
    description: Wave state runtime file
    enforcement_level: block

  # ── Domain Spec ──────────────────────────────────────────────────────────
  - artifact_type: domain-spec
    canonical_path_pattern: ".factory/specs/domain-spec/{filename}.md"
    description: Domain specification shard
    enforcement_level: block

  - artifact_type: spec-open-questions
    canonical_path_pattern: ".factory/specs/open-questions.md"
    description: Open questions spec document
    enforcement_level: block

  - artifact_type: spec-dtu-assessment
    canonical_path_pattern: ".factory/specs/dtu-assessment.md"
    description: DTU assessment document
    enforcement_level: block

  # ── Logs ─────────────────────────────────────────────────────────────────
  - artifact_type: runtime-log
    canonical_path_pattern: ".factory/logs/{filename}"
    description: Runtime telemetry and dispatcher logs
    enforcement_level: block

  # ── Policies ─────────────────────────────────────────────────────────────
  - artifact_type: policies
    canonical_path_pattern: ".factory/policies.yaml"
    description: Governance policy registry
    enforcement_level: block

  # ── Config ───────────────────────────────────────────────────────────────
  - artifact_type: release-config
    canonical_path_pattern: ".factory/release-config.yaml"
    description: Release pipeline configuration
    enforcement_level: block

  - artifact_type: reference-manifest
    canonical_path_pattern: ".factory/reference-manifest.yaml"
    description: Reference manifest for brownfield ingestion
    enforcement_level: block

  # ── Holdout Evaluations ──────────────────────────────────────────────────
  - artifact_type: holdout-evaluation
    canonical_path_pattern: ".factory/holdout-evaluations/{filename}.md"
    description: Holdout evaluation document
    enforcement_level: block

  - artifact_type: holdout-scenario-selection
    canonical_path_pattern: ".factory/holdout-scenarios/scenario-selection.json"
    description: Phase-4 scenario-rotation selection written by state-manager (selected holdout scenario IDs)
    enforcement_level: block

  # ── Measurements ─────────────────────────────────────────────────────────
  - artifact_type: measurement
    canonical_path_pattern: ".factory/measurements/{filename}.md"
    description: Measurement and baseline document
    enforcement_level: block

  # ── Research / Plans ─────────────────────────────────────────────────────
  - artifact_type: research-doc
    canonical_path_pattern: ".factory/research/{filename}.md"
    description: Research document
    enforcement_level: block

  - artifact_type: plan-doc
    canonical_path_pattern: ".factory/plans/{filename}.md"
    description: Planning document
    enforcement_level: block

  # ── Legacy / Migration ───────────────────────────────────────────────────
  - artifact_type: legacy-design-doc
    canonical_path_pattern: ".factory/legacy-design-docs/{filename}.md"
    description: Legacy design document (pre-VSDD era)
    enforcement_level: block

  # ── Tech Debt ────────────────────────────────────────────────────────────
  - artifact_type: tech-debt-register
    canonical_path_pattern: ".factory/tech-debt-register.md"
    description: Technical debt register
    enforcement_level: block

  # ── Sidecar / Session Learning ───────────────────────────────────────────
  - artifact_type: sidecar-learning
    canonical_path_pattern: ".factory/sidecar-learning.md"
    description: Session learning sidecar document
    enforcement_level: block

  # ── PO Obligations ───────────────────────────────────────────────────────
  - artifact_type: po-obligations
    canonical_path_pattern: ".factory/po-obligations.md"
    description: Product owner obligations document
    enforcement_level: block

  # ── Semport ──────────────────────────────────────────────────────────────
  - artifact_type: semport-artifact
    canonical_path_pattern: ".factory/semport/{filename}.md"
    description: Semport translation artifact
    enforcement_level: block

  # ── Code Delivery ────────────────────────────────────────────────────────
  - artifact_type: code-delivery-artifact
    canonical_path_pattern: ".factory/code-delivery/{filename}.md"
    description: Code delivery tracking document (flat)
    enforcement_level: block

  - artifact_type: code-delivery-story-artifact
    canonical_path_pattern: ".factory/code-delivery/{story-id}/{filename}.md"
    description: Per-story/TD code delivery artifact (pr-description, review-findings, etc.)
    enforcement_level: block

  # ── Feature Delta Analysis ────────────────────────────────────────────────
  - artifact_type: feature-delta-analysis
    canonical_path_pattern: ".factory/feature-delta/{feature-id}/{filename}.md"
    description: Feature Mode F1 delta analysis and supporting artifacts per feature
    enforcement_level: block

  # ── Dim-2 Gate Templates ─────────────────────────────────────────────────
  - artifact_type: hooks-dim2-gate-template
    canonical_path_pattern: ".factory/hooks/dim2-gates/{filename}"
    description: Dim-2 mechanical gate bash template scripts and registry README (D-453(e))
    enforcement_level: block

  # ── Planning ─────────────────────────────────────────────────────────────
  - artifact_type: planning-product-brief
    canonical_path_pattern: ".factory/planning/product-brief.md"
    description: >
      Product brief written by guided-brief-creation (step-06-finalize) —
      the human-facing L1 brief before spec crystallization.
      BC-6.07.038 postcondition; distinct from .factory/specs/product-brief.md.
    enforcement_level: block

  - artifact_type: planning-elicitation-notes
    canonical_path_pattern: ".factory/planning/elicitation-notes.md"
    description: >
      Overflow context captured during guided-brief-creation elicitation
      (steps 2 + 6). Written when non-trivial details exceed the brief's scope.
      Phase 1 reads this for PRD / architecture / NFR hints (BC-6.07.038).
    enforcement_level: block

  - artifact_type: planning-market-intel
    canonical_path_pattern: ".factory/planning/market-intel.md"
    description: >
      Market intelligence report written by guided-brief-creation step-02
      when web research is triggered (domain unfamiliar / competitive landscape
      unknown). Referenced by step-03 elicitation and step-06 finalize.
    enforcement_level: block

  - artifact_type: planning-adversarial-review-brief
    canonical_path_pattern: ".factory/planning/adversarial-review-brief.md"
    description: >
      Adversarial review record written by guided-brief-creation step-05
      (optional). Documents findings, triage, and APPROVED/RETURNED outcome
      for the product brief. Left in place by step-06 as audit trail.
    enforcement_level: block

  - artifact_type: planning-brainstorming-report
    canonical_path_pattern: ".factory/planning/brainstorming-report.md"
    description: >
      Brainstorming session report written by the brainstorming skill
      (step-06-write-report). Contains all ideas, themes, selected direction,
      and open questions. Input to guided-brief-creation step-02 discovery.
    enforcement_level: block

  - artifact_type: planning-artifact-inventory
    canonical_path_pattern: ".factory/planning/artifact-inventory.md"
    description: >
      Artifact inventory written by artifact-detection step-01. Records what
      planning artifacts were found in the project before readiness
      classification.
    enforcement_level: block

  - artifact_type: planning-gap-analysis
    canonical_path_pattern: ".factory/planning/gap-analysis.md"
    description: >
      Gap analysis written by artifact-detection step-04. Records validation
      results and specific gaps for each artifact level (brief, PRD,
      architecture, stories).
    enforcement_level: block

  - artifact_type: planning-routing-decision
    canonical_path_pattern: ".factory/planning/routing-decision.md"
    description: >
      Routing decision written by artifact-detection step-05. Records which
      pipeline entry point was selected based on the readiness level and
      gap analysis.
    enforcement_level: block

  - artifact_type: planning-brief-validation
    canonical_path_pattern: ".factory/planning/brief-validation.md"
    description: >
      Validation report written by the validate-brief skill. Checks the
      product brief for required sections, specificity, and measurable
      success criteria against the brief-validation-template. Referenced
      in the planning.lobster brief-approval gate.
    enforcement_level: block

  - artifact_type: planning-readiness-report
    canonical_path_pattern: ".factory/planning/readiness-report.md"
    description: >
      Implementation readiness report written by the implementation-readiness
      skill. Assesses all spec dimensions (BCs, VPs, stories, architecture,
      DTU coverage) for L4 routing and records an overall READY/NOT READY
      verdict. Referenced in the planning.lobster intake-approval gate.
    enforcement_level: block

  - artifact_type: planning-research-report
    canonical_path_pattern: ".factory/planning/research-report.md"
    description: >
      Domain research report written by the planning-research skill. Contains
      sourced findings on the problem space, technology landscape, and
      audience pains. Input to guided-brief-creation elicitation (step-02).
    enforcement_level: block

  - artifact_type: planning-research-sources
    canonical_path_pattern: ".factory/planning/research-sources.md"
    description: >
      Citations and source links companion document written by the
      planning-research skill alongside research-report.md. Provides
      full bibliographic records for all claims in the research report.
    enforcement_level: block

  - artifact_type: planning-domain-research
    canonical_path_pattern: ".factory/planning/domain-research.md"
    description: >
      Domain research artifact written by research-agent when dispatched
      by the orchestrator for planning-phase domain research
      (research-agent write scope: .factory/planning/; canonical path per
      orchestrator.md absolute-path convention).
    enforcement_level: block

  - artifact_type: planning-prd-validation
    canonical_path_pattern: ".factory/planning/prd-validation.md"
    description: >
      PRD validation report written by the consistency-validator agent in
      the planning.lobster validate-existing-prd step (L2/L3/L4 intake
      track). Checks BC-S.SS.NNN ID format, measurable ACs, and edge case
      catalog. Referenced in the intake-approval gate.
    enforcement_level: block

  - artifact_type: planning-architecture-validation
    canonical_path_pattern: ".factory/planning/architecture-validation.md"
    description: >
      Architecture validation report written by the architect agent in the
      planning.lobster validate-existing-architecture step (L3/L4 intake
      track). Checks ARCH-INDEX.md structure, section completeness, purity
      boundary map, and PRD consistency. Referenced in the intake-approval
      gate.
    enforcement_level: block

  - artifact_type: planning-market-context
    canonical_path_pattern: ".factory/planning/market-context.md"
    description: >
      Market context analysis written by the business-analyst agent when
      dispatched by the orchestrator for competitive and audience analysis
      during planning (docs/FACTORY.md dispatch example). Distinct from
      market-intel.md (written by guided-brief-creation step-02).
    enforcement_level: block

  # ── Proposals ────────────────────────────────────────────────────────────
  - artifact_type: proposal
    canonical_path_pattern: ".factory/proposals/{filename}.md"
    description: "Architectural design proposals (e.g., SK-MCP-001, PA-MOD-001, UNI-PLUG-001)"
    required_frontmatter:
      - "document_type: proposal"
      - proposal_id
      - title
      - status
      - author
      - date
    enforcement_level: block

  - artifact_type: story-index-amendment-history
    canonical_path_pattern: ".factory/stories/STORY-INDEX-amendment-history.md"
    description: Frozen pre-migration D-1149 amendment-history sidecar for stories/STORY-INDEX.md (BC-10.13.001 PC6 — read-only; last-amended-migrate never mutates it)
    enforcement_level: block

  - artifact_type: bc-index-amendment-history
    canonical_path_pattern: ".factory/specs/behavioral-contracts/BC-INDEX-amendment-history.md"
    description: Frozen pre-migration D-1149 amendment-history sidecar for specs/behavioral-contracts/BC-INDEX.md (BC-10.13.001 PC6 — read-only; last-amended-migrate never mutates it)
    enforcement_level: block

  - artifact_type: bc-index-changelog-archive
    canonical_path_pattern: ".factory/specs/behavioral-contracts/BC-INDEX-changelog-archive.md"
    description: Evergreen changelog archive written by rotate_changelog_at (BC-1.18.009 PC5/PC2) — overflow changelog entries rotated out of BC-INDEX.md when the inline changelog exceeds the cap
    enforcement_level: block

  - artifact_type: arch-index-amendment-history
    canonical_path_pattern: ".factory/specs/architecture/ARCH-INDEX-amendment-history.md"
    description: Frozen pre-migration D-1149 amendment-history sidecar for specs/architecture/ARCH-INDEX.md (BC-10.13.001 PC6 — read-only; last-amended-migrate never mutates it)
    enforcement_level: block

  - artifact_type: vp-index-amendment-history
    canonical_path_pattern: ".factory/specs/verification-properties/VP-INDEX-amendment-history.md"
    description: Frozen pre-migration D-1149 amendment-history sidecar for specs/verification-properties/VP-INDEX.md (BC-10.13.001 PC6 — read-only; last-amended-migrate never mutates it)
    enforcement_level: block

  - artifact_type: state-amendment-history
    canonical_path_pattern: ".factory/STATE-amendment-history.md"
    description: Frozen pre-migration D-1149 amendment-history sidecar for STATE.md (BC-10.13.001 PC6 — read-only; last-amended-migrate never mutates it)
    enforcement_level: block
