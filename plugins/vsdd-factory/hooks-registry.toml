# hooks-registry.toml — Human-edited source of truth as of v1.0.0.
# The v0.79.x→v1.0 migration generator has been retired; edit this file
# directly to add or modify hook registrations.
#
# Most entries route through hook-plugins/legacy-bash-adapter.wasm,
# which reads `[hooks.config] script_path` and execs the underlying
# bash script. Native-WASM ports (S-2.5 onward) replace individual
# entries one-by-one; 21 native-WASM ports (S-2.5+) coexist with
# 35 legacy-bash-adapter entries in this same file.

schema_version = 2

# ---------------------------------------------------------------------------
# TOOL-FILTER REGEX SEMANTICS (S-19.04 AC-003)
#
# The `tool` field in [[hooks]] entries is matched using regex SEARCH semantics
# (substring match), NOT fullmatch.  This means an unanchored value such as
#   tool = "Edit|Write"
# will also fire on "MultiEdit" (because "Edit" is a substring of "MultiEdit")
# and on any future tool whose name contains "Write" or "Edit" as a substring.
#
# ANCHORING CONVENTION — required for all new and existing entries:
#   Single tool:     tool = "^Bash$"
#   Multiple tools:  tool = "^(Edit|Write|MultiEdit)$"
#
# Why anchoring matters:
#   Without anchoring,  tool = "Edit"       matches MultiEdit, MultiEdit*, etc.
#   Without anchoring,  tool = "Write"      would match a hypothetical MultiWrite.
#   Without anchoring,  tool = "Bash"       would match a hypothetical BashAsync.
#   With prefix-only,   tool = "^Bash"      STILL matches BashAsync via regex-SEARCH — both anchors required.
#
# Entries that intentionally rely on unanchored (prefix/substring) matching MUST
# carry an inline `# intent:` comment explaining the design choice (EC-001).
# The AC-005 bats lint test enforces this invariant in CI:
#   Every tool= line must be fully anchored (leading ^ AND trailing $ immediately
#   before the closing quote) or carry an # intent: comment.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CAPABILITY SCHEMAS (S-19.06 AC-007)
#
# The following capability blocks are available for declaring in [[hooks]]
# entries. Each block documents the fields and semantics of the corresponding
# capability. This section is separate from the TOOL-FILTER REGEX SEMANTICS
# block above (S-19.04 AC-003); do NOT embed capability schema documentation
# inside the tool-filter anchoring section.
#
# CAPABILITY: [hooks.capabilities.read_prefix]
#   Enables the `vsdd::read_prefix` host function for a hook plugin.
#   Returns at most `max_bytes` bytes from the start of a file (head-c
#   semantics). GUARANTEED never to return OUTPUT_TOO_LARGE (-3) — by
#   construction, `max_bytes` IS the cap; data beyond the cap is simply
#   not read.
#
#   INDEPENDENT of `capabilities.read_file` — a plugin granted
#   `capabilities.read_file` does NOT automatically receive
#   `capabilities.read_prefix` (BC-1.17.001 Invariant 3, defense-in-depth).
#   Both capabilities must be declared separately when a plugin needs both.
#
#   Schema:
#     [hooks.capabilities.read_prefix]
#     path_allow = ["/absolute/path/to/allowed/directory"]
#
#   Fields:
#     path_allow — required; list of absolute paths or directory prefixes
#                  the plugin is permitted to read from using read_prefix.
#                  The dispatcher uses the same rejoin+starts_with algorithm
#                  as capabilities.read_file (BC-1.17.001 Invariant 4).
#
#   Error codes:
#     0   OK              — success; response is at most max_bytes bytes
#     -1  CAPABILITY_DENIED — capability block absent or path not in path_allow
#     -2  TIMEOUT           — call exceeded timeout_ms budget
#     -5  NOT_FOUND         — path in path_allow but file does not exist
#     -99 INTERNAL_ERROR    — directory target, OS-level I/O failure
#
#   Note: OUTPUT_TOO_LARGE (-3) is NEVER returned by read_prefix.
#         Use capabilities.read_file when complete, untruncated file
#         content is required (e.g., parsing a full TOML/YAML document).
# ---------------------------------------------------------------------------

# ---------- SessionStart ----------

[[hooks]]
name = "session-start-telemetry"
event = "SessionStart"
plugin = "hook-plugins/session-start-telemetry.wasm"
timeout_ms = 8000
async = true

[hooks.capabilities.read_file]
path_allow = [".claude/settings.local.json"]

[hooks.capabilities.exec_subprocess]
binary_allow = ["factory-health"]

# ---------- SessionEnd ----------

[[hooks]]
name = "session-end-telemetry"
event = "SessionEnd"
plugin = "hook-plugins/session-end-telemetry.wasm"
timeout_ms = 5000
async = true

