# ---------- validate-wave-handoff-completeness (PostToolUse, Write|Edit) ----------
# BC-4.14.001 §Precondition 1 / AC-014: PostToolUse gate that validates
# HANDOFF.md completeness on every Write/Edit tool call. Blocks with
# HandoffIncomplete when required ADR-026 §D2 fields are missing or malformed.
# on_error = "continue": WASM crash → fail-open Continue (BC-4.14.001 PC6).
# async = false: synchronous gate; block must be returned before Claude proceeds.
