# ---------- verify-state-timestamp-advisory (ADR-032 AC-021) ----------
# PostToolUse advisory: emits ADVISORY AC-021 when a factory-artifacts commit
# included STATE.md but did not advance the timestamp: frontmatter field.
# advisory-only (on_error=continue; never blocks — PostToolUse cannot prevent commits).
# Reads git_context from payload.extra (injected by dispatcher ADR-032-AC021-prereq).
# No capabilities block: exec-free, no read_file, no exec_subprocess (BC-5.41.003 PC1).
# Priority 159 = lowest free slot above 154 (validate-dispatch-advance).
# (traces to ADR-032 AC-021 / BC-5.41.003 / BC-5.40.001 PC6)

# ---------- validate-unvalidated-mutation-marker — S-25.01 Layer-1 Next-Advance Gate ----------
# BC-1.18.002: TWO registry entries for the SAME WASM binary (BC-1.18.002 invariant 1; AC-019).
# Both entries reference hook-plugins/validate-unvalidated-mutation-marker.wasm.
#
# Arm 1 (^Agent$): blocks Agent dispatches while .factory/unvalidated-mutation.marker exists.
# Arm 2 (^Bash$):  blocks git commit/push Bash dispatches while the marker exists.
#   The \bgit\b.*\b(commit|push)\b regex is ILLUSTRATIVE ONLY — authoritative Arm-2 filter is
#   the Phase 1-4 tokenized algorithm is_git_commit_or_push (BC-1.18.002 §PC2). It is
#   PLUGIN-INTERNAL logic (reads `command` parameter); it is NOT a registry field.
#   Non-advancing Bash commands (git status, cargo test) pass through.
#
# BOTH entries MUST have failure_policy = "fail-open" (BC-1.18.002 invariant 2; AC-011).
# failure_policy = "fail-open" governs marker-WRITING only: if the gate plugin itself
# fuel-exhausts or crashes it does NOT write a NEW marker — preventing self-lock via new
# quarantine. However, on gate crash/fuel/timeout the dispatcher's native
# on_error = "block_if_marker" check applies: if a non-expired marker ALREADY EXISTS the
# dispatch is BLOCKED (BC-1.18.002 PC5 / EC-031 ADR-048 §D1); if the marker is absent or
# TTL-expired the dispatch is ALLOWED (BC-1.18.002 PC6 / EC-009 / EC-032 ADR-048 §D1).
# Recovery: remove .factory/unvalidated-mutation.marker or wait for the 24-hour TTL.
#
# No priority assigned: gate runs in default priority tier. The marker-check is fast (single
# file-presence check) and does not conflict with existing priority assignments.

[[hooks]]
name = "validate-unvalidated-mutation-marker"
event = "PreToolUse"
tool = "^Agent$"
plugin = "hook-plugins/validate-unvalidated-mutation-marker.wasm"
# ADR-048 §Decision 1: on_error="block_if_marker" — WASM crash/timeout triggers a NATIVE
# filesystem check. If a non-expired .factory/unvalidated-mutation.marker exists the dispatch
# is blocked (crash + quarantine-signal → Block). If the marker is absent or expired the
# dispatch is allowed (crash + no quarantine → Allow). This closes the CWE-636 gap where
# WASM crash + valid-quarantine-signal silently allowed the dispatch under "continue".
# failure_policy = "fail-open" UNCHANGED (BC-1.18.002 INV2 self-lock prevention).
on_error = "block_if_marker"
async = false
failure_policy = "fail-open"

[[hooks]]
# Arm 2: same WASM binary as Arm 1 (BC-1.18.002 invariant 1; AC-019).
# The git commit/push filter (is_git_commit_or_push, BC-1.18.002 v1.3 tokenized subcommand match)
# is implemented inside the WASM plugin by reading the `command` parameter from the Bash tool
# event payload — NOT a registry field.
name = "validate-unvalidated-mutation-marker-git"
event = "PreToolUse"
tool = "^Bash$"
plugin = "hook-plugins/validate-unvalidated-mutation-marker.wasm"
# ADR-048 §Decision 1: on_error="block_if_marker" — same crash-policy as Arm 1. Both arms
# must have identical on_error semantics (BC-1.18.002 invariant 1: same binary, same gate
# invariants). See Arm 1 comment above for rationale.
on_error = "block_if_marker"
async = false
failure_policy = "fail-open"

[[hooks]]
name = "verify-state-timestamp-advisory"
event = "PostToolUse"
tool = "^Bash$"
plugin = "hook-plugins/verify-state-timestamp-advisory.wasm"
priority = 159
timeout_ms = 5000
async = false
on_error = "continue"
