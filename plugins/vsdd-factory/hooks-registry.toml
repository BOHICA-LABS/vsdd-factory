# ---------- validate-burst-log (PostToolUse, Bash — ADR-029 §Decision 1) ----------
# Chain-detection gate: reads git_context from payload.extra (injected by dispatcher
# host layer on PostToolUse Bash git-commit events). WASM is exec-free:
# no exec_subprocess for commit-context acquisition (BC-5.41.003 PC1; ADR-029 §Decision 3).
# Fail-open: absent/empty git_context → Continue (BC-5.41.003 Invariant 5; BC-1.16.001 INV3).
# Same WASM binary as Edit|Write entry above; dispatches on tool_name == "Bash" internally.

[[hooks]]
name = "validate-burst-log"
event = "PostToolUse"
tool = "^Bash$"
plugin = "hook-plugins/validate-burst-log.wasm"
priority = 152
timeout_ms = 5000
# on_error = "continue": WASM logic handles legitimate fail-open by returning HookResult::Continue
# (absent git_context, empty fields, initial commit). Crash-fail-open is accepted for chain
# detection — consistent with project-wide PostToolUse fail-open stance (see Edit|Write entries).
# A WASM crash emits a telemetry log_warn (SEC-004 fix) making silent bypasses observable.
on_error = "continue"

[hooks.capabilities.read_file]
path_allow = [
  ".factory/cycles",
  ".factory/hooks",
]

