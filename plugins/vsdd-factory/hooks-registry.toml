# ---------- validate-factory-path-staging (PreToolUse, Bash) ----------
# S-21.01: Layer-1 invariant guard for INV-E21-001 (Nested Worktree Path Exclusivity).
# Blocks any Bash-tool `git add` command that stages a path under `.factory/` on a
# product branch (develop, main, feature/*, release/*, maintenance/*).
# Fail-open (on_error=continue): a crashed guard never wedges the session; Layer-2
# (per-story-delivery.md §Main-Checkout Sync Protocol) provides defense-in-depth.
# ADR-031 §Decision 2+3; BC-4.16.001; POLICY 21 compliance: native WASM, no .sh file.
# Priority 140 — same tier as verify-git-push (140, ^Bash$); same-priority plugins execute
# in parallel (registry.rs ~L217, S-1.6), not sequentially by registry order. Parallel
# execution is safe: validate-factory-path-staging and verify-git-push have disjoint
# check surfaces (staging-path guard vs push-destination guard) with no shared state.
# Next Bash-matcher sibling: verify-factory-lock-bash (142, ^Bash$).
# Dispatcher sorts ascending: lower priority number fires first (140 < 142).

[[hooks]]
name = "validate-factory-path-staging"
event = "PreToolUse"
tool = "^Bash$"
plugin = "hook-plugins/validate-factory-path-staging.wasm"
priority = 140
timeout_ms = 5000
on_error = "continue"
async = false
# S-25.01 Cohort A-immediate (ASSIGNED-NOW — corrected from the overclaiming EFFECTIVE-NOW
# label per BC-1.18.004 v1.2): validate-factory-path-staging is assigned failure_policy =
# "fail-closed" unconditionally. PreToolUse ^Bash$; on_error = "continue"; bounded input
# (file path from tool params); calibration confirmed; no S-21.24 dependency. Its
# PreToolUse-only registration structurally cannot reach the PostToolUse-only marker-write
# path, so the assignment produces ZERO observable enforcement effect at S-25.01 merge
# (ADR-047 §D8a Cohort A-immediate; BC-1.18.004 v1.4 PC4; AC-016). S-25.04 adds a companion
# PostToolUse detective mirror, validate-factory-path-staged (priority 161), which IS
# structurally reachable (BC-4.16.002; BC-1.18.004 v1.4 PC4 companion statement) — see that
# entry below for the non-Cohort-A fail-closed sanction (ADR-039 §Decision 2).
failure_policy = "fail-closed"

[hooks.capabilities.exec_subprocess]
binary_allow = ["git"]
# PATH omitted: the dispatcher process inherits PATH from its parent Claude session;
# the child git subprocess resolves the binary via that inherited PATH without needing
# PATH re-injected into the plugin sandbox. Proven by AC-001 dispatcher-level block tests.
env_allow = ["HOME", "GIT_CONFIG_GLOBAL", "XDG_CONFIG_HOME"]

