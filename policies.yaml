  - id: 13
    name: hh_n_regex_alternation_predicates
    description: "Pre-fix scope-determination grep predicates MUST use regex-alternation (-E flag with | alternation) covering all syntactic forms of canonical-violation pattern, not single literal strings. Each predicate covers all permutations (table-cell vs heading vs prose vs lowercase descriptive)."
    adopted: "2026-05-14 (E-10 pass-13 fix burst D-468; codifies HH-4 structural resolution from pass-13 §7); extended 2026-07-27 (D-920 NORMALIZATION-ADVERSARIALITY-MANDATE + ALTERNATION-WIDENING-DIRECTION-STATEMENT-MANDATE per F-S2104-P18-001/002/005 ninth-generation class); extended 2026-07-27 (D-923 ESCAPE-SCOPE-PARITY-MANDATE + BOUNDARY-POLARITY-MANDATE + NORMALIZATION-ADVERSARIALITY-TOKENIZER-DIRECTION-EXTENSION per F-S2104-P19-001/002/004 [process-gap] tenth-generation class)"
    severity: HIGH
    enforced_by: [adversary-prompt, architect-prompt, state-manager-prompt]
    scope: [bc, vp, story, epic, architecture, all-spec]
    lint_hook: null
    codified_at: D-472
    amended_at: D-923
    verification_steps:
      - "Adversary: when surfacing a canonical-violation finding, predicate must use regex-alternation grep (-E flag with alternation), not single literal string"
      - "Architect: pre-fix scope-determination grep at fix-burst time must use HH-N predicate with regex-alternation covering all syntactic forms"
      - "State-manager: post-fix verification grep must use the same regex-alternation form; verbatim stdout captured per POLICY 15 (LL-N)"
      - "MUTANT-DERIVED-GATE ALTERNATION MANDATE (v1.4.11; D-912 + F-S2104-P14R-001 third-generation class; D-497 parsimony extension): when a bats gate predicate is added in response to a specific mutant token T (e.g., a gate keyed on 'CWD-relative' in response to the M-P14-A polarity-inversion vector), the predicate MUST be a POLICY-13 alternation over the syntactic-form CLASS of T — all tokens a doc writer might use to express the same concept (e.g., 'CWD-relative|worktree-relative|relative[[:space:]]+path' for the class of 'prohibited-path-form subjects'). The attestation MUST record at least one synonym-substituted mutant (a vector substituting a class-member synonym for T) proving the alternation fires RED on the synonym AND GREEN on the original text. A gate whose attestation records only the originating vector T but no synonym-substituted vector is structurally incomplete — it proves coverage of T but not the class. Detection: for each bats gate that is labeled as 'added in response to mutant X', grep the attestation for a synonym-substituted vector beyond X; if none present, flag as POLICY 13 HIGH (mutant-derived-gate alternation gap). A claim of 'polarity-COMPLETE' or 'class-complete' is forbidden until a synonym-substituted mutant is RED-proven."
      - "NORMALIZED-DOMAIN MANDATE (D-914 per F-S2104-P15-001 fifth-generation class; D-497 parsimony extension): semantic gates over prose MUST be evaluated on normalized domain — reflow the target paragraph into one joined block before applying predicates (e.g., `joined_block=$(echo \"$section\" | tr '\\n' ' ')`), then optionally sentence-split (e.g., `sentences=$(echo \"$joined_block\" | sed 's/\\. /\\n/g')`). Per-physical-line grep over a soft-wrapped markdown paragraph is FORBIDDEN as a polarity gate because line-wrap position is not semantic content and any physical-line predicate can be bypassed by reformatting the same content across different line boundaries. A LINE-REWRAP mutant (same semantic content, different word-wrap position) MUST be attested GREEN in the attestation to confirm the gate is wrap-invariant before it is shipped. Detection: for each bats gate that operates over a multi-line markdown paragraph (section extracted via awk or sed), verify the implementation normalizes first with `tr '\\n' ' '` before applying grep predicates; a bare `grep 'pattern' <section>` or `echo \"$section\" | grep` without tr normalization over a known-wrapped paragraph is a POLICY 13 HIGH finding (per-physical-line gate over wrapped prose). A gate whose attestation lacks a LINE-REWRAP GREEN proof is structurally incomplete — the LINE-REWRAP proof is a necessary attestation element parallel to the deletion-mutant proof."
      - "NEGATION-TRANSPARENCY MANDATE (D-916 per F-S2104-P16-001 seventh-generation class; D-497 parsimony extension): every affirmative-mandate gate over prose MUST use a positionally-tight pattern — `MUST[[:space:]]+use[[:space:]]+<subject>` with no permissive wildcard between the modal token and the verb. Wildcards spanning `[^.]*` or `.*` between MUST and its verb are FORBIDDEN because they cross negation tokens (`NOT`, `not`, `never`) and allow `MUST NOT use canonical absolute` to match an affirmative-mandate predicate. Two required additions: (i) the affirmative predicate MUST use fixed-whitespace spacing (`MUST[[:space:]]+use`); (ii) a paired explicit negative gate asserting `MUST[^.]*(NOT|not|never)[^.]*<subject>` does NOT match MUST be added alongside, attested with a negation-insertion mutant (`MUST NOT use X`) proving it fires RED. The negation-insertion mutant is a MANDATORY attestation element for all new affirmative-mandate gates, parallel to the deletion-mutant requirement. Detection: for each bats affirmative-mandate gate, check whether the pattern uses `[^.]*` or `.*` between modal and verb; if found, flag as POLICY 13 HIGH (negation-transparent predicate). A gate attesting only the non-negated form without a negation-insertion mutant is structurally incomplete."
      - "ANCHOR-UNIQUENESS MANDATE (D-916 per F-S2104-P16-003 HIGH; D-497 parsimony extension): any bats extractor whose output feeds semantic gates MUST assert its anchor pattern occurs exactly once within its bounding section (count-equals-1 gate); the helper MUST exit with an explicit `ambiguous anchor` error if count ≠ 1. The extractor MUST be bounded to the narrowest child heading that exclusively contains the normative content (not a parent heading encompassing both normative and other prose). A decoy-insertion mutant (a compliant paragraph inserted before the normative paragraph inside the bounding section) MUST be attested RED as a mandatory proof element. Detection: for each bats extractor using awk `found=1` latch + blank-line stop, verify: (a) count-equals-1 gate before latch; (b) section boundary is the narrowest child heading; (c) attestation includes decoy-insertion mutant RED proof. Absence of any of (a)/(b)/(c) → POLICY 13 HIGH (anchor-uniqueness gap)."
      - "DOMAIN-COMPLETENESS MANDATE (D-918 per F-S2104-P17-001 eighth-generation class; D-497 parsimony extension): negative (prohibition-asserting) prose gates MUST evaluate the ENTIRE bounded section they govern, not a single paragraph within that section. Paragraph-scoping is admissible only for positive existence assertions. Every negative gate MUST carry a SIBLING-PARAGRAPH mutant — a vector placing the harmful text in a sibling paragraph within the same bounded section, distinct from the anchor paragraph — and that mutant MUST be attested RED. A negative gate that passes a sibling-paragraph mutant is a paragraph-scoped gate masquerading as a section-scoped gate: flag as POLICY 13 HIGH (domain-completeness gap). Detection: for each bats negative gate, verify the domain variable is extracted from the full bounded section (awk over entire child heading, fenced-code excluded) rather than a single-paragraph extractor (awk terminated at first blank line). Section-wide extraction is the normative form; blank-line-terminated extraction is FORBIDDEN for negative gates. HTML-comment spans MUST be excluded before gate evaluation OR the gate MUST assert their absence with a comment-hidden-mandate mutant proving that compliance cannot be hidden inside <!-- --> spans."
      - "FAIL-CLOSED-IMPLICATION-DIRECTION MANDATE (D-918 per F-S2104-P17-002 eighth-generation class; D-497 parsimony extension): for any negative prose gate, the predicate alternation MUST be in the FAILING position of a logical implication whose other side is an open class. PREFERRED FORM: 'every sentence containing X (open class: any sentence in domain) must contain a prohibition token from set P (closed set)' — fails CLOSED on paraphrase of X because unlisted paraphrases of X still satisfy the open-class trigger. FORBIDDEN FORM: 'no sentence may contain X together with Y' (closed X and closed Y) — fails OPEN on paraphrase of either X or Y because the alternate phrasing is not in either closed list. Detection: for each negative gate that uses a two-alternation co-occurrence predicate (grep for pattern-A AND pattern-B in the same sentence), verify that at least one alternation is an open-class trigger (any sentence in the domain) — if both are closed lists, flag as POLICY 13 HIGH (fail-open implication direction). The mandatory review question: 'if the doc author paraphrases the prohibited-target form, does the gate fire or fall silent?' Any negative gate that falls silent on paraphrase is a paper-gate under TD-VSDD-059 regardless of mutant count, because the mutants are drawn from the same vocabulary as the predicate."
      - "NORMALIZATION-ADVERSARIALITY MANDATE (D-920 per F-S2104-P18-002 BLOCKER-class ninth-generation; D-497 parsimony extension): every extraction, exclusion, or normalization mechanism in a gate's data path MUST itself carry mutants, because a mechanism that can silently shrink a gate's domain is indistinguishable in effect from deleting the gate. Specifically: (i) any EXCLUSION step (fence-stripping, comment-stripping, line filtering) MUST be accompanied by (a) a structural assertion that the excluded region is well-formed (e.g., balanced fence delimiters — odd fence count is a structural defect that silently collapses the domain; the balanced-fence POSITIVE assertion is the required form) and (b) a mutant placing harmful text INSIDE the excluded region, proving the exclusion does not provide a bypass (M-P18-C is the canonical form: harmful content placed inside a fenced bash block must become RED after the fence exclusion is removed); (ii) any TOKENIZATION step (sentence splitting, joining, abbreviation protection) MUST be accompanied by mutants in BOTH directions: (a) false-boundary direction — a mutant that manufactures a false sentence boundary from ordinary prose using an unlisted abbreviation (M-P18-B is the canonical form: `No. 523` silences a sentence-scoped gate when the splitter is whitespace-driven rather than capitalisation-driven); (b) missed-boundary direction — a mutant where a sentence-initial token the splitter does not recognize (e.g., lowercase initial, digit, quote) causes two logical sentences to merge into one (M-P19-D is the canonical form: a lowercase-initial harmful clause merges into its predecessor, passing exclusion-based gates because the preceding sentence's prohibition token covers the merged block — CONTROL-D differing only in capitalising the initial letter is RED via polarity-violation gate) (D-923 per F-S2104-P19-004 [process-gap] tenth-generation class extension). The fail-open consequence of missed-boundary differs from false-boundary: false-boundary causes fail-CLOSED gates (positive existence) to miss a legitimate match; missed-boundary causes fail-OPEN gates (exclusion-based `grep -Ev`) to pass a harmful clause merged under cover of a legitimate preceding clause. Both false-boundary AND missed-boundary mutants are MANDATORY attestation elements; absence of either is POLICY 13 HIGH (tokenizer-direction gap). A normalization or exclusion mechanism that has NO mutant proving its bypass path is FORBIDDEN — recording such mechanisms in a table labeled 'not assertion gates' is the exact inversion this mandate corrects: it is a paper-exemption that eliminates the adversarial probe precisely where a hole exists. Detection: for each bats extraction, exclusion, or normalization mechanism, verify: (a) structural well-formedness assertion exists; (b) bypass mutant places harmful text in the excluded/filtered region and is attested RED. Absence of either → POLICY 13 HIGH (normalization-adversariality gap)."
      - "ESCAPE-SCOPE-PARITY MANDATE (D-923 per F-S2104-P19-001 [process-gap] tenth-generation class; D-497 parsimony extension): for every gate of the form `<trigger> AND NOT <escape>`, the record MUST state the syntactic unit over which each side is evaluated, and the two MUST be the same unit. Rule: escape scope ≤ trigger scope. Where they differ (escape unit > trigger unit), the gate MUST carry two mandatory controls: (i) a POSITIVE control proving the escape is non-vacuous — text containing the escape phrase in the same trigger clause passes GREEN; (ii) a NEGATIVE-TWIN control placing the escape phrase in a sibling clause separate from the harmful clause — must fire RED, proving the escape is clause-scoped rather than sentence-scoped. An escape that exempts an entire sentence from a per-clause gate launders every other clause in the sentence: one appended prohibition word restores the mandate in the exempt clause while the harmful clause proceeds. This is the natural companion to FAIL-CLOSED-IMPLICATION-DIRECTION: pass-18 codified that the trigger must be open (implication fails closed on paraphrase of the trigger); pass-19 shows that an open trigger with an over-broad escape is no stronger than a closed trigger — the escape side must also match trigger granularity. Detection: for each bats gate containing `grep -Ev` with an escape predicate, verify the audit row states both trigger unit and escape unit, and carries the positive+negative-twin control pair; if absent, flag as POLICY 13 HIGH (escape-scope-parity gap). The F-S2104-P19-001 recurrence is the canonical form: a write-directive gate whose `grep -Ev` escaped an entire sentence (containing a prohibition token anywhere) while the trigger evaluated per-clause — M-P19-A placed the escape phrase and a harmful mandate in the same sentence at 9/9 GREEN."
      - "BOUNDARY-POLARITY MANDATE (D-923 per F-S2104-P19-002 [process-gap] tenth-generation class; D-497 parsimony extension): whenever a gate's domain is narrowed — by heading bound, by line filter, by token filter, or by any exclusion step — the burst MUST record: (i) the class of content the narrowing was introduced to exclude (the false-positive class); (ii) whether harmful content of the OPPOSITE polarity (the prohibited-mandate class) can occupy the excluded region while remaining rendered to the reader; (iii) a mutant proving the answer — either proving the excluded region cannot harbor harmful content (SAFE boundary) or confirming it can and extending the gate to cover it (UNSAFE boundary requires gate extension in the same burst). A domain narrowing justified only by the false positive it suppresses is half an argument; the unexamined half is where the attack lives. Detection: for each bats gate whose awk extractor, sed filter, grep exclusion, or heading-bound restricts the domain, verify the audit row records the boundary-polarity analysis for the excluded region; if absent, flag as POLICY 13 HIGH (boundary-polarity gap). Note: NORMALIZATION-ADVERSARIALITY governs exclusion bypass proofs (harmful content placed INSIDE the excluded region to prove it cannot bypass the gate); BOUNDARY-POLARITY adds the complementary requirement for narrowing boundaries (harmful content placed OUTSIDE the narrowed domain but still rendered to the reader, e.g., above an #### heading that scopes the domain). The F-S2104-P19-002 recurrence is the canonical form: bounding to `#### Write Discipline` neutralised a false-positive decoy (correct rationale) but simultaneously excluded rendered prose three lines above that heading — M-P19-H placed verbatim harmful mandates above the heading at 9/9 GREEN."
      - "ALTERNATION-WIDENING-DIRECTION-STATEMENT MANDATE (D-920 per F-S2104-P18-001/005 BLOCKER/HIGH-class ninth-generation; D-497 parsimony extension): any burst that adds a member to an existing alternation in a gate predicate MUST, in the same burst, explicitly state the DIRECTION of that alternation: is it on the OPEN side (trigger — any sentence in domain) or the CLOSED side (enumeration — only listed forms)? Two cases: (a) if the alternation is the TRIGGER (open side of an implication), new members expand coverage legitimately — state 'direction: (b) open trigger' in the audit row; (b) if the alternation is the ENUMERATION (closed side of an implication), adding members is a paper-fix by construction, because a paraphrase not on the list still evades — in this case the burst MUST ALSO add a complementary OPEN-TRIGGER gate covering the same obligation axis, and the audit row MUST state 'direction: (b) closed enumeration; backstopped by <gate-name> (open trigger)'. A widening that does neither is a paper-fix under TD-VSDD-059 regardless of mutant count, because the added mutants are drawn from the same vocabulary as the predicate and do not probe the unlisted-synonym axis. Detection: for each burst containing `|` additions to an existing bats alternation, verify the story AC Gate cell and red-gate-log audit row contain a direction statement; if absent, flag as POLICY 13 HIGH (alternation-widening-direction-statement absent). The detection is mechanically available: `git diff HEAD~ -- *.bats | grep '^+.*|' | grep -v '^+++' | grep -v '^\\+\\+\\+'` surfaces alternation additions; the corresponding story cell and audit row must be updated in the same burst."

  - id: 14
    name: kk_n_tripartite_parity_gate
    description: "When a body changelog row is added with version v(N+1), the same burst MUST sync ALL 5 parity legs: (1) version: frontmatter, (2) body Changelog row, (3) frontmatter modified[] array, (4) frontmatter last_amended: text-prefix, (5) upstream-index body-table cells citing the bumped artifact. Codified at D-468 (3-leg); extended at D-490 to 5-leg quintuple parity per INV-020 CONFIRMED."
    adopted: "2026-05-14 (D-468; codifies KK-2 tripartite-parity from E-10 pass-11/12 discipline); extended 2026-05-20 (D-490; codifies INV-020 5-leg quintuple parity per pass-5 F-BC006P5-001 + F-BC006P5-002)"
    severity: HIGH
    enforced_by: [state-manager-prompt, consistency-validator, pre-commit-hook]
    scope: [bc, vp, story, epic]
    lint_hook: null
    codified_at: D-472
    extended_at: D-494
    verification_steps:
      - "For each file with body Changelog section, verify latest row date matches frontmatter last_amended: date prefix"
      - "Verify frontmatter modified: array's last entry corresponds to latest body Changelog row"
      - "Verify frontmatter version: matches body Changelog row's version cell"
      - "Verify frontmatter last_amended: TEXT PREFIX (e.g., '(v1.6) — ...') matches body Changelog top row's version (5-leg leg-4; codified D-490)"
      - "Verify upstream-index body-table cells citing the bumped artifact (e.g., BC-INDEX body table for BC bumps; STORY-INDEX body table for story bumps) reflect the new version same-burst (5-leg leg-5; codified D-490)"
      - "All five legs must be updated in the same burst — no deferred-frontmatter pattern; no deferred-upstream-index pattern"
      - "State-manager codification bursts that bump any of the 4 indexes (BC/VP/STORY/ARCH) MUST run a literal-shell self-application gate BEFORE commit: for each of 4 indexes, grep ^version: and ^last_amended:, extract the v-prefix, assert match. Template: `for IDX_PATH in BC-INDEX.md VP-INDEX.md STORY-INDEX.md ARCH-INDEX.md; do V=$(grep -E '^version:' \"$IDX_PATH\" | grep -oE '\"[0-9]+\\.[0-9]+\"' | tr -d '\"'); LA=$(grep -E '^last_amended:' \"$IDX_PATH\" | grep -oE '\\(v[0-9]+\\.[0-9]+\\)' | head -1 | tr -d '()v'); [ \"$V\" = \"$LA\" ] && echo PASS || echo FAIL; done`. Gate produces zero FAIL output before commit (5-leg leg-4 self-application; codified D-494 per INV-020 RECURRENCE at the 4-index codifying-burst level)."
      - "SAME-BURST PREDICATE-GATE CELL COUPLING (D-916 per F-S2104-P16-004 HIGH regression; D-497 parsimony extension): when a test-writer burst changes any predicate in a T-N class bats test for story S-NNN (new regex, domain shape change, polarity extension, gate addition or removal), the story S-NNN AC Gate cell for that T-N test MUST be updated in the same burst or in a story-writer leg gated on the test-writer commit. Protocol: (1) test-writer MUST enumerate affected story AC Gate cells in the SendMessage report to the orchestrator on completion; (2) orchestrator MUST dispatch a story-writer leg for those cells before the fix wave is declared complete; (3) story-writer AC Gate cell update MUST use the final T-N predicate forms (regex verbatim, domain shape named explicitly, no `per extracted line` or `per line` language). Detection: for any test-writer commit that changes a predicate in a T-N class bats test, grep the corresponding story AC Gate cell; if the cell still references the OLD predicate form, flag as POLICY 14 HIGH (same-burst predicate-gate coupling gap; regression class per F-S2104-P16-004 and F-S2104-P14R-006)."
      - "ERRATUM-ROW MODIFIED[] PARITY CONVENTION (D-992 per F-S2107-P10-009 [LOW] S-21.07 pass-10; D-497 parsimony extension): a body Changelog row whose version cell carries an `-erratum` suffix (e.g. `1.15-erratum`) is a same-day correction NOTICE overlaid on an EXISTING version, not a new version bump — it does NOT require a corresponding `modified[]` frontmatter array entry, because `modified[]` tracks distinct version numbers and `X.Y-erratum` is not a distinct version number (the next real version bump, e.g. `1.16`, carries its own `modified[]` entry per the normal 5-leg gate). This is a REGISTERED EXEMPTION, not an ad-hoc carve-out: legs 1 (frontmatter version), 2 (body Changelog row), 4 (last_amended text-prefix), and 5 (upstream-index cell) still apply normally to the erratum row and to the version it corrects; only leg 3 (`modified[]` entry) is exempted for the erratum row specifically. Detection: for each body Changelog row whose version cell matches `^[0-9]+\\.[0-9]+-erratum$`, verify NO `modified[]` entry is expected for that exact string (its absence is COMPLIANT, not a leg-3 gap); a leg-3 finding against an `-erratum` row without this exemption on record is a false positive. If a future burst introduces a differently-shaped correction-notice suffix (not `-erratum`), the burst MUST either apply this same exemption explicitly (citing this bullet) or register a new one — silent unexamined suffix-pattern proliferation is forbidden."

  - id: 15
    name: ll_n_verbatim_stdout_discipline
    description: "Literal-shell evidence at persistence layer (changelog rows, decision-log rows, commit bodies) MUST include both command verbatim AND captured file:line: stdout verbatim, OR sentinel '(zero output)' / '(EXIT:1; no matches)'. Narrative paraphrase of grep outcomes is NOT compliant. Extended at D-889 to include per-guard mutant-verification mandate for bats test guards."
    adopted: "2026-05-14 (D-468; codifies LL-3 strict-form elevating LL-2 hybrid-command+narrative-output to full file:line: requirement); extended 2026-07-24 (D-889 PER-GUARD-MUTANT-VERIFICATION-MANDATE; human-directed; &&{false;}||true inert-guard class); extended 2026-07-27 (D-920 BACKSTOP-DOMAIN-PARITY-MANDATE per F-S2104-P18-005 ninth-generation class)"
    severity: HIGH
    enforced_by: [adversary-prompt, state-manager-prompt, consistency-validator]
    scope: [arch-index, bc-index, vp-index, story-index, cycle-decision-log, cycle-burst-log, bats-test-guards]
    lint_hook: null
    codified_at: D-472
    extended_at: D-889
    amended_at: D-920
    verification_steps:
      - "Adversary: when verifying a closure claim, check the changelog/decision-log row for verbatim file:line: stdout content (not just command text)"
      - "State-manager: when writing changelog/decision-log rows asserting grep verification, include verbatim stdout (file:line: matched-text) or sentinel (zero output) or (EXIT:1; no matches)"
      - "Narrative paraphrase like 'all rows are legitimate exclusions' or 'zero live violations' is forbidden — must show verbatim file:line: evidence"
      - "LL-2 hybrid form (verbatim command + narrative output) is NOT compliant; LL-3 requires both command AND verbatim output"
      - "PER-GUARD MUTANT-VERIFICATION MANDATE (D-889; human-directed 2026-07-24): bats test guards of the form `<cmd> && { false; } || true` (inert-guard class: &&{false;}||true pattern) MUST include at least one mutant-proving test vector in the same test file demonstrating the guard ACTUALLY FIRES when the trigger condition is true. A guard matching this pattern that has no mutant-proving test is a POLICY 15 HIGH finding. Detection: grep test files for the pattern `&&[[:space:]]*{[[:space:]]*false[[:space:]]*;` (or equivalent inert-guard signature); for each match, verify at least one @test block asserts the failure path is exercised when the trigger condition holds. S-7.14 (bats inert-guard lint, D-889) registered for automated CI detection of this class."
      - "ATTESTATION-LOCATION GATE (v1.4.23; ADR-040 §Decisions 7-10; supersedes v1.4.22;
  F-S2107-P10-001/002/003 BLOCKER resolution): a code-repo commit that adds or strengthens
  any *.rs/*.bats file in crates/hook-plugins/validate-cross-site-correspondence/ MUST NOT
  be pushed until the pinned red-gate-log.md attestation section EXISTS at that same commit
  (per-commit obligation — not push-tip-only). Gate runs as a required-check CI job in the
  code repo (NOT in factory-artifacts worktree — running in factory-artifacts was the
  v1.4.22 vacuity defect: 0 *.rs/*.bats files of 3743 total). Job is UNCONDITIONAL — no
  paths: filter (a paths-filtered skipped job reports SUCCESS, itself a vacuous pass). CI
  checkout MUST use fetch-depth: 0. Log path is PATH-PINNED (architectural constant):
  crates/hook-plugins/validate-cross-site-correspondence/docs/red-gate-log.md. FAIL-when-
  absent: if the pinned log does not exist at the commit being checked, gate FAILS — absence
  is a violation, not a skip condition. Stale-pin guard (BEFORE range check): if
  crates/hook-plugins/validate-cross-site-correspondence dir does not exist at HEAD →
  EMPTY-or-UNREACHABLE (exit 2, stale pin — crate renamed or moved). Per-commit check:
  COMMITS=$(git log MERGE_BASE..HEAD --format=%H); if COMMITS empty → EMPTY-or-UNREACHABLE
  (exit 2, CI setup defect); for each commit C: ALL_CHANGED=$(git diff --name-only C^1 C);
  if ALL_CHANGED empty → EMPTY-or-UNREACHABLE (exit 2, unmeasurable scope); CHANGED=$(echo
  ALL_CHANGED | grep -cE '^crates/hook-plugins/validate-cross-site-correspondence/
  .*\\.(rs|bats)$'); if CHANGED=0, skip C; else PARENT=$(git rev-parse C^1); check pinned
  log absent at C → FAIL; check git show C:<log-path> | grep -cE '^### .*assertion-site
  attestation \\(PARENT\\)' → 1; if count ≠ 1, FAIL: POLICY 15 HIGH. Four-outcome verdict:
  FAIL (exit 2) / PASS-N-activations (exit 0, N≥1) / PASS-zero-activations (exit 0, scope
  target exists AND all diffs measurable AND no crate matches) / EMPTY-or-UNREACHABLE (exit
  2, stale pin OR empty range OR empty diff). Activation count always emitted in output for
  observability across CI runs. The attestation section heading MUST be '### <Pass-N>
  assertion-site attestation (<PARENT-SHA>)' where PARENT-SHA = git rev-parse HEAD^1 in the
  code repo at commit-preparation time. Same-commit bundling (TD-VSDD-053) retained.
  A voluntary '### <Pass-N> assertion-site stability-record (<PARENT-SHA>)' form is
  permitted for no-change commits (informational only; MUST NOT substitute for a real
  attestation on assertion-site commits). Non-vacuity controls (MANDATORY, project-wide gate
  rule — §Decision 10): a separate CI job 'attestation-gate-non-vacuity-controls' MUST run
  unconditionally; it verifies seven EICAR-style controls: pc-1 (crate *.rs, no log →
  FAIL: obligation violated), pc-2 (log present, no heading → FAIL: obligation violated),
  pass-zero (docs-only + non-rs/bats file committed inside crate dir → PASS-zero-activations
  exit 0), empty-range (crate in tree, MERGE_BASE=HEAD → EMPTY-or-UNREACHABLE: git range
  returned no commits exit 2), stale-pin (non-empty range, no crate in tree →
  EMPTY-or-UNREACHABLE: stale pin exit 2), empty-diff (crate in tree, --allow-empty commit
  → EMPTY-or-UNREACHABLE: unmeasurable diff exit 2), negative (correct heading →
  PASS-N-activations exit 0). Each control asserts the specific outcome identifier string
  (Requirement 4). All fixtures in mktemp tmpdir repos — no repo SHA dependency. Detection
  (adversary manual check): for each commit H in reviewed branch with *.rs/*.bats changes
  in crates/hook-plugins/validate-cross-site-correspondence: check pinned log absent at H →
  flag FAIL; log present, compute parent P = git rev-parse H^1; check git show H:<log-path>
  | grep -cE '^### .*assertion-site attestation (P)' → 1; if count ≠ 1, flag POLICY 15 HIGH
  with per-commit evidence. Do NOT run this check in factory-artifacts context."
      - "PROJECT-WIDE GATE OUTCOME DISCIPLINE (v1.4.23; D-970 §Codification 1; human-ratified
  2026-08-10; D-497 parsimony extension to POLICY 15): every mechanical gate whose PASS is
  recorded as evidence MUST (a) report distinct, individually-identifiable outcomes; (b) ship
  a control for every outcome — not merely FAIL; (c) have controls assert the outcome
  identifier, not the category. Positive control = violating fixture the gate must reject
  (FAIL outcome). Negative control = compliant fixture the gate must accept (PASS outcome).
  Applies to all gate classes in POLICY 15 scope. A gate missing its PASS-zero-activations
  or EMPTY-or-UNREACHABLE control cannot distinguish 'correctly did not fire' from 'silently
  failed'; category-only assertions (e.g., 'exits 0') admit compensating errors that
  outcome-identifier assertions prevent. First application: ATTESTATION-LOCATION GATE
  §Decision 10 seven EICAR-style controls (pc-1, pc-2, pass-zero, empty-range, stale-pin,
  empty-diff, negative). Detection: adversary verifies that for any gate-hardening burst each
  enumerated gate outcome has a dedicated control fixture and each control asserts the
  specific outcome identifier string (e.g., 'EMPTY-or-UNREACHABLE: stale pin' not merely
  'exit 2')."
      - "SAME-AC GATE AUDIT — OBLIGATION-INDEXED FORM (D-916 per F-S2104-P16-005 MEDIUM; D-497 parsimony amendment to D-914 gate-indexed form): a gate-hardening wave that adds or strengthens any gate for AC-NNN MUST include an obligation-indexed AC coverage table as the PRIMARY coverage proof, with columns: AC Clause, Gate(s) asserting, Mutant proving each. A supplemental gate-indexed table (columns: Gate, Domain shape, Polarity-asserting, Mutant coverage) MAY accompany it but is NOT the primary proof. The closing claim MUST be per-obligation (e.g., 'AC-NNN(a)(i) asserted by Gate X — mutant M-P-Y RED') not a gate-set blanket claim (e.g., 'all gates independent, polarity-complete, zero degrees of freedom'). A blanket gate-set closing claim is FORBIDDEN: it converts a gate inventory into a completeness attestation the inventory does not support and is falsified by any surviving vector targeting an ungated obligation. Detection: adversary verifies that for any gate-hardening wave touching AC-NNN, the red-gate-log attestation section contains an obligation-indexed table with one row per AC-NNN clause; if absent or if only a gate-indexed table is present with a blanket closing claim, flag as POLICY 15 HIGH (obligation-indexed audit absent). The hardening standard for each gate remains unchanged: polarity-complete (both affirmative and negative legs), domain-normalized (sentence-scoped per POLICY 13 NORMALIZED-DOMAIN MANDATE), mutant-proven (at least one deletion mutant RED). Root cause of F-S2104-P16-005: the D-914 gate-indexed audit closed with a blanket claim that contradicted its own G2 row disclosure; obligation-indexed form requires each coverage gap to be named explicitly rather than subsumed under a blanket assertion."
      - "NAME-SET-EQUALITY MANDATE (D-918 per F-S2104-P17-006 MEDIUM; D-497 parsimony extension): cross-document gate-inventory parity MUST be asserted by NAME-SET EQUALITY, not cardinality. Cardinality-match (both documents say 'N gates') is insufficient because two documents can agree on count while enumerating disjoint sets — a compensating error that count-based checking cannot detect. The required check is: (1) extract sorted gate labels from the story AC Gate cell; (2) extract sorted gate labels from the red-gate-log gate-indexed audit table; (3) run a literal-shell diff of the two sorted lists; (4) record the diff stdout (expected: empty, indicating exact label parity). A non-empty diff stdout is a POLICY 15 HIGH finding (name-set-equality gap). Detection: adversary verifies that the red-gate-log attestation section for the reviewed HEAD contains a NAME-SET EQUALITY section with literal-shell diff evidence; if absent or if only a count-comparison is present, flag as POLICY 15 HIGH. The check is mechanically available today: `printf '%s\\n' <gate-labels> | sort > /tmp/a.txt; printf '%s\\n' <gate-labels> | sort > /tmp/b.txt; diff /tmp/a.txt /tmp/b.txt`."
      - "BACKSTOP-DOMAIN-PARITY MANDATE (D-920 per F-S2104-P18-005 HIGH-class ninth-generation; D-497 parsimony extension): when a fix predicate specifies a BACKSTOP gate whose purpose is to make another gate's enumeration non-load-bearing (i.e., the backstop gate is the open-trigger complement that closes the ALTERNATION-WIDENING-DIRECTION-STATEMENT mandate's closed-enumeration case), the two gates MUST share a domain, and the red-gate-log audit table MUST show their domains in adjacent rows so a domain divergence is visible on inspection. Where domains legitimately differ (e.g., the backstop gate covers a different syntactic form or a different section scope), the divergence MUST be stated in THREE places in the same burst: (1) in the bats code comment for both gates, (2) in the story Gate cell listing both gates, and (3) in the audit table rows for both gates. A backstop gate that silently operates on a narrower domain than the gate it backstops provides no actual backstop — the attacker exploits the domain gap by placing the harmful text in the unguarded region. Detection: for each pair of gates where gate B is described as 'backstopping' or 'backing' gate A, verify in the audit table that their domain rows are adjacent and their domain descriptions are either identical or explicitly annotated with divergence rationale; if absent, flag as POLICY 15 HIGH (backstop-domain-parity gap). The F-S2104-P18-005 recurrence (Gate 2b(c) paragraph-scoped while Gate 2b(a) was section-wide) is the canonical example: the backstop was designed to make the nullification list non-load-bearing but operated on the prohibition paragraph only while the nullification gate was section-wide — a domain gap of exactly one scope level that admitted three surviving vectors."

  - id: 16
    name: mm_n_cross_cycle_namespace_gate
    description: "D-NNN identifiers are GLOBAL namespace across all cycles. State-manager MUST allocate next-D-NNN > max(all existing D-NNN across all cycle decision-logs). Any body content citing a D-NNN must be verifiable at citation-authoring time. Planning-stage placeholder D-NNNs must use sentinel form D-{TBD-pass-N-fix-burst} until allocated."
    adopted: "2026-05-14 (D-468; codifies MM allocation gate + MM-2 citation-authoring scope extension from pass-13 §7)"
    severity: HIGH
    enforced_by: [state-manager-prompt, architect-prompt, pre-commit-hook]
    scope: [all-cycles, decision-log, spec, story]
    lint_hook: null
    codified_at: D-472
    verification_steps:
      - "State-manager: pre-burst, run grep across all cycle decision-logs to find global D-NNN max; assert next-allocation is global-max+1"
      - "Architect: when authoring body changelog rows citing D-NNN, verify D-NNN exists in appropriate cycle's decision-log AT THAT TIME (citation-authoring scope)"
      - "Planning-stage placeholders use sentinel form like D-{TBD-pass-N-fix-burst}; must NOT use bare D-NNN before allocation"
      - "Cross-cycle: D-NNN from F5 cycle must not be reused in brownfield cycle and vice versa; global namespace is shared"
      - "RECORD-PERSIST-BURSTS-INCLUDE-SAME-COMMIT-CODIFICATION (D-918 per D-917 erratum): when a record-persist commit (e.g., adversary-pass-N.md persist) cites a D-NNN codification decision in its commit message body, that D-NNN block MUST be persisted in the SAME commit, not deferred to a follow-up commit. Rationale: the commit message establishes citation-authoring-time provenance for the D-NNN; a D-NNN cited in a commit but absent from the decision-log at that commit is a forward-reference that cannot be verified at citation-authoring time (POLICY 16 §citation-authoring scope violation). Detection: for each record-persist commit, grep the commit message for D-NNN references; for each D-NNN found, verify it exists in the decision-log AT THAT COMMIT SHA. A D-NNN that is cited in commit C but only appears in a follow-up commit C' is a POLICY 16 HIGH finding (deferred-codification pattern). Recovery: append the D-NNN block in the same commit as the record-persist, not in a follow-up commit."
      - "ALLOCATOR-CEILING GATE (ADR-041 §Decision 2-3): before each D-NNN allocation, state-manager MUST assert that the global max ALLOCATED D-NNN — across all structural forms (h2 ^#{2,} D-NNN, h3 ^#{2,} D-NNN, table-cell ^[|] *D-NNN) in all cycle decision-log.md files, NOT prose mentions — is strictly less than 9000. Gate fails CLOSED on empty result (empty = corpus scan failure, not a clean slate). D-9000 through D-99999 are the reserved sentinel range; D-99999 is the canonical test-fixture sentinel for 'correctly formatted but nonexistent D-NNN' scenarios (replaces deprecated D-999 sentinel per ADR-041 §Decision 1). Literal-shell gate predicate (D-449(a) compliant — two-command form for POSIX portability; avoids ERE alternation with literal pipe): `max_d=$({ grep -hE '^#{2,} D-[0-9]+' .factory/cycles/*/decision-log.md 2>/dev/null; grep -hE '^[|] *D-[0-9]+' .factory/cycles/*/decision-log.md 2>/dev/null; } | grep -oE 'D-[0-9]+' | sed 's/D-//' | sort -n | tail -1); if [ -z \"$max_d\" ]; then printf 'FAIL: D-NNN ceiling gate: zero allocation records found — corpus scan failure; gate fails closed\\n'; exit 1; fi; [ \"$max_d\" -lt 9000 ] && printf 'PASS: global max D-%s < D-9000 ceiling\\n' \"$max_d\" || { printf 'FAIL: D-NNN allocation ceiling breach: max=D-%s\\n' \"$max_d\"; exit 1; }` Exit code 0 = allocation permitted. Exit code 1 = allocation blocked; human must adjudicate sentinel re-migration before resuming. STATE.md AUTHORING DISCIPLINE (ADR-041 §Decision 4): narrative referencing the sentinel migration MUST NOT embed bare D-99999 as a parseable D-NNN token in STATE.md body or current_step: (scan_max_d_nnn in validate-dispatch-advance scans full STATE.md content; sentinel value must remain only in spec/fixture files). Reference 'per ADR-041' rather than the literal sentinel value in STATE.md prose."

  - id: 17
    name: nn_n_frontmatter_parity_full_file_type_scope
    description: "KK-N tripartite-parity discipline (POLICY 14) applies to all 4 file-type layers: BC, epic, story, VP. Each file type has the same body Changelog, frontmatter last_amended:, and frontmatter modified: requirement at fix-burst time."
