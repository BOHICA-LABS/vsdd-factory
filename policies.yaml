# .factory/policies.yaml — Declarative governance policy registry
#
# Each project maintains its own policy list. The adversarial-review skill
# auto-loads this file into the adversary's dispatch rubric. Lint hooks
# read this file to determine which validators to run.
#
# Initialize with: /vsdd-factory:policy-registry init
# Add policies with: /vsdd-factory:policy-add <name>
# Validate with: /vsdd-factory:policy-registry validate
#
# Schema per entry:
#   id: <integer>              # Sequential policy number
#   name: <string>             # snake_case policy flag name
#   description: <string>      # One-line human-readable description
#   adopted: <string>          # Context where adopted (burst, pass, or date)
#   severity: <HIGH|MEDIUM>    # Severity floor for violations
#   enforced_by: [<string>]    # Enforcement mechanisms
#   scope: [<string>]          # Artifact types this policy covers
#   lint_hook: <string|null>   # Path to automated hook (relative to plugin root)
#   verification_steps: [<string>]  # Step-by-step check procedure for the adversary
#                                   # Baseline policies (1-9) have steps baked into agent
#                                   # prompts. Custom policies (10+) MUST include steps
#                                   # here so the adversary knows HOW to verify them.
#   codified_at: <D-NNN|null>  # Decision-log D-NNN at which this policy was formally
#                              # registered as a D-NNN-class governance event. Baseline
#                              # policies (1-12) predate the codified_at convention
#                              # (established by D-472 / S-15.06 F-PASS14-003 closure
#                              # 2026-05-15); their codified_at is null. POLICY 13-18
#                              # were registered at commit b8909832 (2026-05-14) and
#                              # retroactively assigned D-472 per S-15.06.

policies:
  - id: 1
    name: append_only_numbering
    description: "All VSDD identifiers are never renumbered or reused. Retired IDs stay in indexes. Filename slugs are immutable."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc, vp, di, cap, story, hs]
    lint_hook: null
    codified_at: null
    verification_steps:
      - "Scan all index files for retired/removed IDs — verify no active artifact reuses a retired ID"
      - "Verify retired entries have replaced_by or removal justification"
      - "Check that filename slugs match original creation (compare git log if available)"

  - id: 2
    name: lift_invariants_to_bcs
    description: "Every domain invariant (DI-NNN) must be cited by at least one BC's Traceability L2 Invariants field. Orphan invariants are drift."
    adopted: baseline
    severity: MEDIUM
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [di, bc]
    lint_hook: null
    codified_at: null
    verification_steps:
      - "Read domain-spec/invariants.md — extract all DI-NNN IDs"
      - "For each DI-NNN, search BC files for citations in Traceability/L2 Invariants fields"
      - "Report orphan invariants (DI declared but no BC enforces it)"
      - "Verify invariant Scope/enforcer column names BCs that cite it back (bidirectional)"

  - id: 3
    name: state_manager_runs_last
    description: "State-manager agent must be the last to commit in every burst, preventing version-race regressions."
    adopted: baseline
    severity: HIGH
    enforced_by: [orchestrator-rule]
    scope: [story, bc, vp, architecture]
    lint_hook: null
    codified_at: null
    verification_steps:
      - "Review burst commit history — state-manager commits must come after all other agents"
      - "Check for citation staleness — STORY-INDEX/BC-INDEX versions must match latest story-writer/PO output"

  - id: 4
    name: semantic_anchoring_integrity
    description: "Every anchor claim must be semantically correct, not just syntactically valid. Mis-anchoring always blocks convergence."
    adopted: baseline
    severity: MEDIUM
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc, vp, story, architecture]
    lint_hook: null
    codified_at: null
    verification_steps:
      - "For each BC, verify declared capability actually describes the BC's purpose per capabilities.md"
      - "For each story, verify subsystems: field references subsystems that own the story's scope per ARCH-INDEX"
      - "For each VP, verify anchor_story builds the test vehicle (not an architectural ancestor)"
      - "For traceability table rows, verify descriptions match target artifact's actual title"
      - "DESCRIPTION-BEARING ANCHOR-PROSE PARITY (v1.4.4; D-809 per F-P52-001+F-P53-001/002 class): traceability-table row descriptions, VP frontmatter module: fields, VP §Traceability Function-anchor/Subsystem/Anchor-story bullets, and VP §Feasibility Artifact cells are ALL description-bearing anchor prose and MUST derive from the target artifact's SoT (BC H1/§Architecture Anchors, story §File Structure/body BC-table). Detection: per-field grep of the described path/semantics against the target SoT; zero-match or contradiction = POLICY 4 mis-anchor MEDIUM+."

  - id: 5
    name: creators_justify_anchors
    description: "Agents creating anchors must justify each choice against the source-of-truth artifact. Stop and ask rather than guess."
    adopted: baseline
    severity: MEDIUM
    enforced_by: [adversary-prompt]
    scope: [bc, vp, story, cap, architecture]
    lint_hook: null
    codified_at: null
    verification_steps:
      - "Check that BC→CAP anchors include justification citing capabilities.md"
      - "Check that story→subsystem anchors include justification citing ARCH-INDEX"
      - "Check that VP→anchor_story assignments justify why that story builds the test vehicle"
      - "Flag mechanical citations without body substantiation"
      - "SDK-GROUNDING MANDATE (v1.3; D-516 per L-S-15.17-SP3-SDK-grounding-mandate): For every BC narrative claim about external artifact (SDK symbol, file path, cycle name, type signature, registry priority, sibling pattern), require literal-shell grep of actual source artifact at BC §SDK Grounding Evidence section (or named equivalent) with captured stdout per POLICY 15. A BC section making claims about external state (e.g., 'HostError::OutputTooLarge variant', 'current_cycle: field in STATE.md', 'Vec<u8> return type in sibling hooks') without corresponding grep evidence in §SDK Grounding Evidence is a MEDIUM-severity finding. This closes the BC-authoring-without-SDK-grounding root cause confirmed at pass-3 (F-SP3-002 + F-SP3-003 + F-SP3-006 share this root). Codified D-516 per cure-extension-parsimony (D-497): extends POLICY 5 'creators justify anchors' rather than introducing new policy."
      - "STABLE-ANCHOR SUB-CLAUSE (v1.3.1; F-SP4-002 META-LEVEL-32 cure-extension): All grep captures in §SDK Grounding Evidence MUST use stable anchors only — heading prefix `^## `, function signature `^pub fn `, regex pattern `^key:`, etc. Line numbers are FORBIDDEN in captured stdout. Specifically: (a) do NOT use grep -n (which prefixes output with file:NNN:); (b) do NOT use sed -n 'NNN,MMMp' as the SOLE capture (acceptable as a secondary confirmation when the primary anchor grep identifies the target, but must not be the only evidence); (c) if captured stdout contains file:NNN: format, re-execute with a stable-anchor pattern before persisting. Rationale: line numbers shift with every edit (F-SP4-002 confirmed `## Phase Progress` drifted from line 61 to 64 in one burst); stable anchors (heading prefix, fn signature) are invariant to line drift."
      - "SIBLING-SWEEP MANDATE (v1.3.3; D-{TBD-state-manager-close} per L-S-15.17-SP5-META-33-sibling-sweep-inside-policy-cure): When applying any stable-anchor (v1.3.1) or SDK-grounding (v1.3) discipline to a primary cure site (e.g., a BC §SDK Grounding Evidence section), the fix-burst MUST enumerate and sweep ALL sibling sites where the same evidence pattern appears. Sibling sites include: (a) extractor NOTES in story T-N task pseudocode comments, (b) code-comment line-pin examples in implementation guides, (c) parallel BC body tables that cite the primary BC (e.g., Behavioral Contracts Table version cells), (d) Token Budget row descriptions, (e) ADR architecture-anchor citations. Failure to sweep a sibling is a MEDIUM-severity finding (with [regression] tag if the cure had been previously applied to the primary). Closes META-LEVEL-33 sibling-sweep-inside-policy-cure recurrence first observed at F-SP4-002 + F-SP5-004 + F-SP5-009 + F-SP5-012. Extension chosen per D-497 parsimony (sibling-sweep discipline == verification-step extension already in POLICY 5 scope; META-LEVEL-33 is a sub-route of META-LEVEL-32 stable-anchor recurrence). Story-writer next burst sweeps F-SP5-004/009/010/011/012 sibling sites (T-5 NOTES grep -n strip, BC Table cell v1.3→v1.5, Token Budget row description, PC11/PC12 cite)."
      - "SIBLING-SWEEP LITERAL-SHELL VERIFICATION GATE (v1.3.4; D-519 per L-S-15.17-SP6-META-34-sibling-sweep-verification-gate): After applying sibling-sweep per v1.3.3 mandate, fix-burst MUST execute literal-shell verification command (e.g., `grep -n 'BC v[0-9.]+' <swept-file>` or `grep -nE '<stale-pattern>' <swept-file>`) and capture verbatim stdout. The captured stdout MUST demonstrate zero non-historical stale references (or only references inside Changelog table rows, which are historical by construction). The stdout MUST be included in the fix-burst commit message body OR in burst-log Dim-2/Dim-6 evidence. Sweep claims without captured-stdout verification are MEDIUM-severity findings (META-34 sub-route). Cure-of-cure-of-cure recursion: applied to POLICY 5 v1.3.3 sibling-sweep mandate. Closes META-LEVEL-34 sweep-claim-without-execution recurrence first observed at F-SP6-002 + F-SP6-003 + F-SP6-007."
      - "HISTORICAL-BY-CONSTRUCTION ENUMERATION (v1.3.5 Part A; D-520 per L-S-15.17-SP7-META-35-replay-reproducibility): For purposes of the v1.3.4 verification gate, 'historical-by-construction' references are EXCLUSIVELY: (i) YAML frontmatter modified: array entries; (ii) body ## Changelog table rows (between the '| Version | Date | Description |' header and section end); (iii) [Prior: ...] nested clauses inside the last_amended: field; (iv) body ## Adversary Pass Coverage entries; (v) cycle lessons.md [codified]/[process-gap] cross-references. ALL OTHER body narrative referencing prior BC/story versions (T-N pseudocode comments, BC Table cells, Token Budget rows, Risk tables, Parity Audit notes, LOCAL Adversary Cascade Plan, AC trace cells, EC table notes, §Architecture Anchors) MUST cite the CURRENT version of the artifact-under-review. Provenance-attribution phrasing ('introduced at BC vX, carried forward in BC vY') is acceptable IFF it includes the carry-forward-to-current annotation (Y = current version). Adversary: when executing the v1.3.4 literal-shell gate, exclude ONLY these 5 historical-by-construction site classes from the 'stale reference' determination. All other stale version cites are violations regardless of prose framing."
      - "HEAD-REPRODUCIBILITY-OR-STRUCTURAL-FORM MANDATE (v1.3.6 Part B; per F-SP8-006/F-SP8-PG-001 META-LEVEL-36 cure-extension): Captured stdout in §SDK Grounding Evidence MUST EITHER (a) be reproducible at HEAD against the current factory-artifacts SHA (the adversary fresh-context loop executes at HEAD; the gate predicate must yield identical stdout when run on current artifacts), OR (b) capture STRUCTURAL-FORM invariants only (regex form, presence counts, header occurrences, structural patterns) that survive monotonic content evolution and remain identical across cycle SHAs. **Snapshot-annotation-only cures (e.g., 'Captured at SHA X — historically valid') are FORBIDDEN** — they admit cure-forms that satisfy the literal letter of (i)/(ii)/(iii) but defeat the reproducibility guarantee via fresh-context-loop-asymmetry. This supersedes the v1.3.5 Part B mandate (which allowed SHA-pinned snapshot cures) by closing the snapshot-annotation-rescue-pattern: any cure that works at SHA X but fails at current HEAD is a META-36 violation. Adversary: when verifying §SDK Grounding Evidence greps, execute them at HEAD — if a grep fails or yields different output, flag as META-36 recurrence even if the BC annotates a historical SHA."
      - "SNAPSHOT-RESCUE-PATTERN DETECTION (v1.3.6 Part D; per F-SP8-006/F-SP8-PG-001 META-LEVEL-36): Adversary fresh-context loop executes captured-stdout gate predicates at HEAD. If gate stdout differs from the BC-attested capture (even when the BC annotates a historical SHA), this is a META-36 violation. The cure MUST be: (a) re-capture at HEAD with reproducible structural-form-only invariants, OR (b) replace the body citation with a re-execute-at-burst-time instruction (e.g., 'see live grep against HEAD STATE.md' rather than pasted stdout). The intent: structural invariants (e.g., 'every state-manager Commit E template includes the trajectory-tail marker') are evergreen; specific stdout snapshots are not. Adversary: for each §SDK Grounding Evidence block that cites a snapshot SHA or contains 'Snapshot: captured at', verify the block also includes HEAD-reproducible structural predicates. If snapshot-only without structural-form predicates, flag as META-36 violation."
      - "SIBLING-SWEEP CATEGORY EXTENSION (a)-(h) (v1.3.5 Part C; D-520 per F-SP7-003 category gap): The v1.3.3 sibling-sweep categories (a)-(e) are extended to (a)-(h). New categories: (f) Risk-Mitigation table cells (titles + mitigations + traces in story §Risk section); (g) §Bidirectional Parity Audit Note version-cite cells (any version reference in the parity audit table or prose); (h) §LOCAL Adversary Cascade Plan prerequisite refs + adversary-MUST-verify-notes (any BC version cited in the cascade plan's prerequisites or verification instructions). When sweeping sibling sites per v1.3.3 mandate, include all 8 categories (a)-(h) in the enumeration. Failure to sweep a category-(f)/(g)/(h) site is a MEDIUM-severity finding with [regression] tag (META-33/META-34 sub-route). Adversary: when verifying sibling-sweep completeness, check categories (f)/(g)/(h) explicitly."
      - "SIBLING-SWEEP CATEGORY EXTENSION (i) (v1.3.7; D-791 per F-P36-001 META-33 sub-route): categories (a)-(h) extended with (i) same-file aggregation cells that duplicate per-row values (delivery summaries, 'All N distinct' attests, wave-summary Input-hashes lines, index aggregation paragraphs). When any per-row cell is bumped, all same-file aggregation cells duplicating that value MUST be swept same-burst. Failure is MEDIUM with [regression] tag."
      - "SIBLING-SWEEP CATEGORY EXTENSION (j) (v1.3.8; D-799 per F-P43-004): categories (a)-(i) extended with (j) body §Property Statement / §Description / §Postcondition inline parenthetical cites (e.g. `(BC-X PCn)`) at same-file semantic-parallel sites. Any anchor migration or PC renumbering MUST sweep these inline cites same-burst with per-cite ground-truth verification. Failure is MEDIUM with [regression] tag."
      - "INVOCATION-SIGNATURE-FORM PARITY (v1.4.5; D-815 per F-P57-001 class): VP §Proof Harness Skeleton script-invoking @test blocks MUST invoke scripts with the ADR §Decision canonical invocation form (positional vs named-flag, including required positional arguments such as `<pr_number>`). The invocation signature is a load-bearing test-fidelity anchor because a mismatched form defeats the script's ability to test the correct behavior (e.g., `--live-sha` bypasses the `gh pr view` fetch that is the load-bearing behavior of check-stale-verdict.sh). Detection: grep VP §Proof Harness script invocation lines for `run bash` and `result=$(bash` patterns; extract argument form; compare against ADR §Decision `**Invocation:**` clause; zero unexpected `--named-flag` arguments expected vs ADR canonical positional form. When an ADR adjudicates an invocation-form migration (e.g., named-flag → positional), propagation directives MUST enumerate VP §Proof Harness invocation signatures as sweep sites alongside BC §Architecture Anchors and story §File Structure. 11th standing gate."
      - "ADR-ANCHOR-FIELD PARITY (v1.4.6; D-817 per F-P58-001 class): VP §Source Contract `**ADR:**` field and §Traceability `**ADR:**` field MUST both name the governing ADR consistent with the VP's own §Property Statement ADR cites. A 'not an ADR-documented decision' claim is forbidden when an ADR §Decision governs a postcondition in the same VP's §Property Statement. §Traceability MUST include a parallel `**ADR:**` bullet when §Source Contract names an ADR (sibling-VP convention: VP-095, VP-097, VP-098 as SoT). Detection: grep VP `\\*\\*ADR:\\*\\*` lines in §Source Contract and §Traceability; verify both cite same ADR as §Property Statement PS-* clauses; verify no 'not an ADR-documented decision' denial when §Property Statement cites that ADR. When an ADR propagation directive enumerates BC §Architecture Anchors and S-NN stories, it MUST also enumerate VP §Source Contract/§Traceability `**ADR:**` anchor fields for VPs whose §Property Statement cites that ADR. 12th standing gate."
      - "MULTILINE-SWEEP MANDATORY DETECTOR (D-1079 per F-S2119-R6-001 [process-gap] Wave-7 pass-7/R6): re-anchor sweeps that remove ADR/BC version pins from spec or story bodies MUST use a whitespace-normalized multiline detector rather than per-physical-line grep. Mandatory form: `tr '\\n' ' ' | grep -oE 'ADR-[0-9]+[[:space:]]+v[0-9]+\\.[0-9]+'` (or equivalent whitespace-join before pattern match). A single-line `grep 'ADR-NNN vX.Y'` silently misses cites that span two physical lines (soft-margin line-wrap splits the pattern across lines; the join step collapses them). Process-gap root cause: F-S2119-P3-001 first surfaced the line-wrap-escape class at D-1061; the tr-detector was applied in the D-1078 fix but not carried forward as a standing mandate, causing F-S2119-R6-001 regression where a 15th site survived a 14-site sweep. Extension per D-497 parsimony (sweep verification — already in POLICY 5 scope as SDK-GROUNDING / SIBLING-SWEEP extension). Adversary detection: when verifying a sweep-completion claim, look for evidence that the sweep used the tr-normalized form or equivalent; a bare `grep -r 'ADR-NNN vX.Y'` sweep claim without a tr-normalize step is MEDIUM (multiline-sweep-gap). Closes F-S2119-R6-001 [process-gap]."
      - "HARNESS-EMITTED LINE-NUMBER CARVE-OUT (D-914 per F-S2104-P15-004 pass-15 bare-pin class): line numbers that appear inside verbatim harness-emitted stdout blocks (e.g., bats `# (in test file ..., line NNN)` annotations, `line NNN` failure markers automatically emitted by the bats test framework into fenced code blocks) are EXEMPT from the stable-anchor prohibition — redacting or replacing them would falsify the verbatim record that POLICY 15 (ll_n_verbatim_stdout_discipline) requires. Authored prose and manual comments remain fully bound: bare line-number pins of the form `line ~NNN`, `~:NNN`, `:NNN`, `lines NNN/MMM` in manually-written comment text, docblocks, or narrative prose are forbidden under TD-VSDD-091. The carve-out is tightly scoped to automatically-emitted harness output only; it authorizes no authored line-number pin. Detection: when auditing for TD-VSDD-091 line-pin violations, strip bats-emitted verbatim-stdout fenced blocks (identified by surrounding `Exit code:` / bats output structure) before grepping for bare line-number patterns in manually-authored text."

  - id: 6
    name: architecture_is_subsystem_name_source_of_truth
    description: "ARCH-INDEX Subsystem Registry is the canonical source for subsystem names. All references must match verbatim."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc, story, prd, architecture]
    lint_hook: null
    codified_at: null
    verification_steps:
      - "Read ARCH-INDEX Subsystem Registry for canonical subsystem names"
      - "For sampled BCs, verify subsystem: frontmatter matches registry exactly"
      - "For sampled stories, verify subsystems: field uses registry names"
      - "Check BC-INDEX subsystem column matches ARCH-INDEX"

  - id: 7
    name: bc_h1_is_title_source_of_truth
    description: "BC file H1 heading is the authoritative BC title. All downstream references must match. Enrichment goes INTO the H1."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [bc, story, prd]
    lint_hook: null
    codified_at: null
    verification_steps:
      - "Sample 10+ BCs — read H1 heading and compare to BC-INDEX title column"
      - "Check for downstream-only enrichment not present in H1"
      - "Verify H1 accurately describes what the BC's postconditions specify"
      - "EDITORIAL-ABBREVIATION EXCEPTION (C-P3-001 adjudication; F-SP3-006 re-confirmed S-18.02 LOCAL pass-3 2026-06-19): The story body `## Behavioral Contracts` TABLE TITLE COLUMN is an EDITORIAL VIEW. Subset-of-H1 abbreviation is PERMITTED in that column provided: (a) the BC ID in the table row is verbatim correct, (b) the version cite (vX.Y) in the table row is verbatim current, and (c) the PC/clause list is present. POLICY 7's enforcement target is (i) BC-INDEX Title column ↔ BC file H1 verbatim parity, and (ii) prohibition on downstream-only ENRICHMENT that is NOT present in the H1 (e.g., adding qualifiers that go beyond the H1's scope). POLICY 7 does NOT require verbatim H1 reproduction in story-body Behavioral Contracts table descriptive title cells. An abbreviation that omits non-essential words (e.g., omitting 'WASM gate blocks HandoffIncomplete on PostToolUse HANDOFF.md writes' down to 'WASM gate') is editorial economy, not a POLICY 7 violation — provided the abbreviation does not introduce text not in the H1 (enrichment) and does not change the meaning. Adversary: when checking story body BC tables, flag ENRICHMENT (title cell text not derived from H1) as POLICY 7 HIGH. Flag ABBREVIATION (title cell is a strict substring/paraphrase of H1) as POLICY 7 at most ADVISORY — do NOT flag as HIGH or MEDIUM absent actual enrichment or an incorrect BC ID/version cite."

  - id: 8
    name: bc_array_changes_propagate_to_body_and_acs
    description: "When a story bcs: frontmatter changes, the same commit must update body BC table, ACs, and Token Budget count."
    adopted: baseline
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [story, bc]
    lint_hook: null
    codified_at: "D-1080"
    verification_steps:
      - "Sample 5+ stories — for each BC in behavioral_contracts: frontmatter (canonical field; alias: bcs: for S-15.03 only), verify it appears in body BC table"
      - "For each BC in behavioral_contracts: frontmatter, verify at least one AC traces to it"
      - "For each BC in body BC table or AC traces, verify it appears in behavioral_contracts: frontmatter"
      - "Verify Token Budget BC count matches len(behavioral_contracts)"
      - "After any PC insertion/deletion/renumbering in BC, story-writer MUST run literal-shell bidirectional AC↔PC parity check (grep PC cites in story per PC in BC; grep BC for each AC PC cite) with captured stdout per POLICY 15. Captured stdout MUST appear in fix-burst commit body or story §Bidirectional Parity Audit Note. Prevents cascade-propagation-gap-from-PC-insertion (META-LEVEL-31 CANDIDATE; D-515)."
      - "AUDIT-BLOCK EXCLUSION MANDATE (v1.2; F-SP3-014 META-LEVEL-31 cure-of-cure): The parity check grep MUST exclude the audit block itself from the grep target to prevent self-counting false-positives. Implement via ONE of: (a) sed strip before grep: `sed '/^## Bidirectional Parity Audit Note/,/^## /d' story.md | grep -c \"BC-5.39.009 PC6\"` (strip audit section before counting); OR (b) explicit AC-per-PC listing: audit MUST list AC numbers per PC explicitly (e.g., 'PC6: AC-7' instead of 'PC6: 1 cite') — so self-counting produces no false-positive (the audit line says 'AC-7' not a count that would increment). A parity audit whose grep target includes the audit block's own stdout is structurally self-counting and constitutes a MEDIUM-severity finding per META-LEVEL-31."
      - "EC-MIRROR ROUTING-RULE (v1.3; D-517 F-SP4-016 process-gap closure): When a story adds an Edge Case (EC) row that references a BC anchor (PC, invariant, AC-class, or §Architecture Anchors), the orchestrator MUST dispatch a same-burst PO mirror task. The PO mirror MUST add an equivalent EC row in the BC with consistent ID and trigger/expected-behavior/test-vector form. The story-writer MUST NOT leave `[needs-po]` placeholder text in the story for EC mirrors deferred across bursts (closes F-SP4-016). The story-writer is responsible for flagging new ECs with `[needs-po-mirror]` to signal the orchestrator. Adversary MUST verify: for any EC in the story body that names a BC PC, an equivalent EC exists in the BC body with matching semantics."
      - "TABLE-CELL-AWARE PARITY GATE (v1.4; D-1080 per F-S2120-R7-001/F-S2121-P8-001/F-S2122-P8-001 MED×3 BC-table-Version-cell straggler class): when a burst claims 'POLICY 8 full propagation' after re-anchoring a BC version pin, the burst MUST run and capture a table-cell-aware grep (`grep -nE '\\| *<BC-ID> *\\| *v[0-9]'`) to isolate the pipe-delimited BC-table Version column cell BEFORE attesting propagation. A free-text grep that does not isolate the Version column cell is NOT sufficient. An unbacked 'full propagation' claim is itself a POLICY 8 finding. Applies to both frontmatter `behavioral_contracts:` sweep AND body BC-table cell sweep. Captured stdout MUST appear in burst-log Dim-2/Dim-6 evidence per POLICY 15 / D-449(a) literal-shell discipline."

