  - id: 18
    name: oo_input_hash_mechanical_verification
    description: "Any narrative claim of input-hash: change MUST be backed by literal bin/compute-input-hash invocation with captured stdout in burst evidence. inputs: array must include all files whose modifications would trigger the input-hash change."
    adopted: "2026-05-14 (D-468; codifies OO discipline from pass-13 §9 F-PASS13-004 — narrative-vs-content drift class); extended 2026-07-27 (D-923 THREE-WAY-INPUT-HASH-EQUALITY-GATE per F-S2104-P19-009 [process-gap] tenth-generation class)"
    severity: MEDIUM
    enforced_by: [state-manager-prompt, architect-prompt, pre-commit-hook]
    scope: [bc, vp, story, architecture]
    lint_hook: null
    codified_at: D-472
    amended_at: D-923
    verification_steps:
      - "When a file's input-hash: field changes in a burst, verify the burst evidence contains literal bin/compute-input-hash invocation + captured stdout matching the new hash"
      - "Verify the file's inputs: array lists every file whose modification triggered the hash change"
      - "If bin/compute-input-hash is not available, document this explicitly and note hash was verified against prior burst narrative; flag for automation in S-15.03 PRIORITY-A"
      - "Reject narrative-attestation-only input-hash drift claims without tool invocation evidence"
      - "THREE-WAY-INPUT-HASH-EQUALITY GATE (D-923 per F-S2104-P19-009 [process-gap] tenth-generation class; D-497 parsimony extension): closure bursts that verify or record a per-story input-hash: value MUST assert three-way equality across all three representations: (1) story frontmatter `input-hash:` field, (2) STORY-INDEX body-table catalog row `input-hash` token for that story, (3) STORY-INDEX aggregation blockquote `S-NNN=` value. Distinctness across the six E-21 hashes is NOT a substitute — a value can be distinct, well-formed, and traceable to the wrong artifact. Gate form: extract all three values via literal-shell grep (stable-anchor form, no -n line-number flags), assert equality, capture stdout showing all three values and their equality result. Detection: adversary verifies the closure burst evidence contains a per-story three-way equality check with captured stdout for any story whose input-hash appears in the burst; if absent or if only two of three representations are compared, flag as POLICY 18 HIGH (three-way-input-hash-equality gap). The hook-authoritative value (computed by the marketplace hook binary, not the development source binary) is canonical per L-EDP1-073; the three-way check confirms all three representations agree on the hook-authoritative value. The F-S2104-P19-009 recurrence is the canonical form: STORY-INDEX carried the red-gate-log's own input-hash (`f86871a`) in the story's catalog row and blockquote while the live story frontmatter was `1165b1f`; the value was distinct, well-formed, and verifiable — just from the wrong document; only per-story three-way equality catches this class."

  - id: 19
    name: adr_version_cite_volatile_pin_prohibition
    description: "BC Traceability rows AND story bodies citing any ADR MUST use stable section-anchor form `ADR-NNN §Decision N` without a load-bearing version number (TD-VSDD-091). Inline ADR version tokens are forbidden as load-bearing identifiers; an informational `(as of vX.Y)` parenthetical is permitted only if explicitly non-load-bearing and ungated."
    adopted: "2026-06-14 (D-567 F2 E-18 pass-6 fix burst — closes recurring stale-ADR-cite class; architect codification confirmed in ADR-026 v1.6 §BC Traceability Cite Convention)"
    severity: HIGH
    enforced_by: [adversary-prompt, consistency-validator]
    scope: [behavioral-contracts-traceability-rows, story-bodies]
    lint_hook: null
    codified_at: D-567
    amended_at: D-1079
    verification_steps:
      - "For each sampled BC Traceability table row that cites an ADR (e.g., '| ADR | ADR-026 v1.5 Decision 10 ... |'), verify the cite does NOT include a load-bearing version token (vX.Y) as a gating identifier"
      - "The correct stable form is `ADR-NNN §Decision N` or `ADR-NNN §<section-name>` (e.g., 'ADR-026 §Decision 10 (PreCompact flush lifecycle...)')"
      - "An informational parenthetical `(as of vX.Y)` is acceptable ONLY if: (a) it is syntactically parenthetical (not the primary reference), AND (b) it is explicitly annotated as non-load-bearing, AND (c) the gate condition does not depend on the version token being current"
      - "Any Traceability row that would fail if the ADR were amended (because the version token would be stale) is a POLICY 19 violation — flag as HIGH"
      - "When a fix burst migrates a stale version cite, run tree-wide grep to enumerate all BC Traceability rows that still cite the ADR with version tokens; complete the migration in the same burst (sibling-sweep per POLICY 5 v1.3.3)"
      - "STORY-BODIES EXTENSION (D-1079 per F-S2123-P7-P19-001 [process-gap] Wave-7 pass-7/R6): POLICY 19 scope extended from `behavioral-contracts-traceability-rows` to also cover `story-bodies`. Load-bearing ADR version pins in story ACs/Tasks/tables/Traceability cells are forbidden — use stable `ADR-NNN §Decision N` / `§AMD-NNN` form. A version token is allowed ONLY in an explicitly non-load-bearing provenance/ratification-event parenthetical (e.g., '(ratified at ADR-044 v1.3 on 2026-08-NN)' where the version token is informational and the gate does not depend on it being current). Detection: for each story body, grep for `ADR-[0-9]+ [^§#(]\\|v[0-9]+\\.[0-9]+` patterns in ACs/Tasks/Traceability cells; flag any occurrence where the version token is load-bearing (the cite would be stale if the ADR were amended). Sweep MUST use whitespace-normalized multiline detector (`tr '\\n' ' ' | grep -oE 'ADR-[0-9]+[[:space:]]+v[0-9]+\\.[0-9]+'`) per D-1079 POLICY-5 MULTILINE-SWEEP extension — single-line grep misses line-wrapped cites. Process-gap root cause: BC pin-strips were not mirrored to sibling stories because nothing bound story ADR pins; this extension closes that gap. Closes F-S2123-P7-P19-001 [process-gap]."

  - id: 20
    name: release_bundle_no_dev_samples
    description: "Release bundles MUST NOT include development sample artifacts (e.g. hello-hook.wasm) or WASMs unreferenced by both hooks-registry.toml and resolvers-registry.toml. Orphan status requires the dual-registry check."
    adopted: "2026-07-06 (D-753 E-19 pass-2 fix burst; architect O-P2-001 adjudication + S-19.04 + L-BB-orphan-status-requires-dual-registry-check)"
    severity: HIGH
    enforced_by: [adversary-prompt, lint-hook]
    scope: [release, bundle]
    lint_hook: null
    codified_at: D-753
    verification_steps:
      - "Check release bundle WASM contents against hooks-registry.toml + resolvers-registry.toml union set"
      - "Flag any WASM file present in the bundle but absent from BOTH registries — this is an orphan artifact"
      - "Apply dual-registry check: orphan status requires absence from BOTH hooks-registry.toml AND resolvers-registry.toml; presence in either registry means NOT orphan"
      - "Development sample artifacts (e.g. hello-hook.wasm) are NEVER release artifacts regardless of registry presence; verify no hello-hook.wasm or analogous dev-sample names are included"
      - "Verify release bundle contains zero WASMs whose name or content indicates a development/testing origin (stub size ≤103B, 'hello' prefix, 'sample' prefix, underscore-prefixed duplicates of production WASMs)"

  - id: 21
    name: no_new_shell_scripts
    description: "No new .sh scripts may be added to the repository going forward — new tooling MUST be platform-agnostic (Rust workspace tests, Rust binaries, or WASM plugins). FULL SCOPE: operational bin/ tools, hooks, CI/test helpers. TEST-DOUBLE-SHIM EXEMPTION (D-889 2026-07-24; human-directed): test-double shim scripts under plugins/vsdd-factory/tests/fixtures/ are exempt by category (not by individual file enumeration) — they are testing infrastructure, do not ship in release bundles, and POLICY 21's platform-agnostic motivation applies to operational tooling, not test harness stubs that exercise bash-version-branching logic in bats. Existing .sh files are grandfathered until class-migration (deferred factory-tools program, E-20 anchor). Human-directed 2026-07-13. 5 S-19.01 files EXPLICITLY GRANDFATHERED at D-846 2026-07-15 (timing collision; human-directed; see grandfather_clause field)."
    adopted: "2026-07-13 (D-836 POST-W1-REGISTRATION burst; human-directed; informed by Rust migration research 2026-07-13); amended 2026-07-15 (D-846 POLICY-21-GRANDFATHER-CLAUSE; human-directed; F-WG-001 grandfather for 5 S-19.01 files: timing collision — spec frozen pre-POLICY, merged post-POLICY; ADR-030 §Decision 2/3 architect-approved; E-20 migration anchor); amended 2026-07-24 (D-889 TEST-DOUBLE-SHIM-EXEMPTION; human-directed; plugins/vsdd-factory/tests/fixtures/ exempt by category)"
    severity: blocking
    enforced_by: [adversary-prompt, state-manager-prompt]
    scope: [repository-wide]
    lint_hook: null
    codified_at: D-836
    amended_at: D-889
    grandfather_clause:
      decision: D-846
      rationale: "S-19.01 spec frozen v1.18 2026-07-11 PRE-POLICY (POLICY 21 codified D-836 2026-07-13); architect-approved ADR-030 §Decision 2/3; merged PR #613 2026-07-13 post-policy — timing collision surfaced at E-19 W1+W2 wave-gate (F-WG-001, D-845); human-directed grandfather 2026-07-15; migration anchored to the E-20 factory-tools class migration alongside all other grandfathered .sh"
      files:
        - plugins/vsdd-factory/bin/check-stale-verdict.sh
        - plugins/vsdd-factory/bin/enforce-merge-strategy.sh
        - plugins/vsdd-factory/tests/fixtures/pr-manager/darwin-leg-preflight.sh
        - plugins/vsdd-factory/tests/fixtures/pr-manager/stub-bash-version.sh
        - plugins/vsdd-factory/tests/fixtures/pr-manager/stub-gh.sh
    test_double_shim_exemption:
      decision: D-889
      rationale: "Test-double shims in plugins/vsdd-factory/tests/fixtures/ are bats testing infrastructure that exercise bash-version-branching logic; they do not ship in release bundles; POLICY 21's platform-agnostic motivation applies to operational tooling not test harness stubs; human-directed 2026-07-24"
      scope: "plugins/vsdd-factory/tests/fixtures/"
    verification_steps:
      - "Verify no new .sh files were added to bin/, plugins/vsdd-factory/hooks/, .github/workflows/, or any other repository location (excluding plugins/vsdd-factory/tests/fixtures/ — see TEST-DOUBLE-SHIM EXEMPTION) in this burst or PR"
      - "If a new shell script is found outside the exempt path: flag as POLICY 21 BLOCKER — route to implementer for Rust/WASM replacement"
      - "Existing .sh files (grandfathered): verify they are on the pre-D-836 list OR explicitly listed in grandfather_clause.files (D-846); no modifications that expand their scope are allowed without human approval"
      - "GRANDFATHER CLAUSE GATE (D-846): exactly 5 files are explicitly grandfathered — plugins/vsdd-factory/bin/check-stale-verdict.sh; plugins/vsdd-factory/bin/enforce-merge-strategy.sh; plugins/vsdd-factory/tests/fixtures/pr-manager/darwin-leg-preflight.sh; plugins/vsdd-factory/tests/fixtures/pr-manager/stub-bash-version.sh; plugins/vsdd-factory/tests/fixtures/pr-manager/stub-gh.sh. These MAY remain as .sh through E-20 factory-tools migration. Any PR adding NEW .sh files beyond this explicit list (and outside the test_double_shim_exemption scope) remains a POLICY 21 BLOCKER. Adversary: verify grandfather_clause.files contains exactly these 5 entries; any addition to the list without a D-NNN + human direction is itself a POLICY 21 violation."
      - "TEST-DOUBLE-SHIM EXEMPTION GATE (D-889): new .sh files under plugins/vsdd-factory/tests/fixtures/ are EXEMPT from POLICY 21 — they are test-double shims (bats testing infrastructure). Adversary: when a new .sh file is found under that path, confirm it is a test-double shim (stub or fixture for bats testing) before applying the exemption; operational scripts masquerading as fixtures are still POLICY 21 violations."
      - "New tooling that would previously have been a .sh script MUST be implemented as: (a) a Rust workspace test, (b) a Rust binary in crates/, or (c) a WASM plugin in hook-plugins/"
      - "Cross-platform compatibility is the primary motivation — Rust/WASM alternatives compile and run identically on Darwin-arm64, Darwin-x86_64, Linux-x86_64, Linux-musl, and Windows-x86_64"

  - id: 22
    name: subagent_report_fidelity_literal_shell
    description: "Subagent narrative summaries of shell output are NOT authoritative for gate decisions. When a subagent summary is load-bearing for a gate decision (is-clean check, count-match, path-list completeness, severity classification, SHA-to-version attribution), the orchestrator/consumer MUST re-run the predicate via literal shell with captured stdout rather than accepting the narrative. Three concrete same-session instances confirmed the pattern (S-21.04 pass-19 closure burst, 2026-07-27): (i) adversary severity mislabels + hallucinated finding content for F-S2104-P19-009/010; (ii) devops-engineer dropped a ` D` deletion line from `git status --porcelain` output; (iii) D-923 completion report mis-attributed story v1.25 to `a14c9f72` (ground truth: `a14c9f72` = v1.24; v1.25 in `578aa7fb`). Extends D-449(a) literal-shell-execution-evidence mandate and META-LEVEL-24 (narrative-attested gates cannot detect their own scope-degradation) to the agent-to-agent reporting channel."
    adopted: "2026-07-27 (D-924 record-correction burst; state-manager; three same-session instances across three distinct agent roles; D-449(a)+META-LEVEL-24 extension to agent-to-agent channel)"
    severity: HIGH
    enforced_by: [orchestrator-prompt, state-manager-prompt]
    scope: [agent-to-agent-reporting, orchestrator-dispatch]
    lint_hook: null
    codified_at: D-924
    verification_steps:
      - "When accepting a subagent summary of shell output as load-bearing evidence for a gate decision (is-clean, count-match, path-list completeness, severity classification, SHA attribution), re-run the predicate via literal shell with captured stdout before recording the gate verdict"
      - "For `git status --porcelain` summaries: always re-run the command directly; do not accept a narrative summary; ` D` (deleted-tracked) lines are silently droppable in narrative synthesis and have downstream clean-tree consequences if left unstaged"
      - "For adversary finding severity summaries: verify severity labels against the adversary report's own finding headers before persisting; do not accept a narrative summary of finding classes as authoritative for gate classification"
      - "For SHA-to-version attribution (e.g., 'story-writer <SHA> — story vN.M'): verify via `git log --oneline <SHA> -1` that the commit subject line confirms the version; commit subjects are ground truth; do not accept narrative attribution"
      - "For fix-wave completeness counts: re-run the enumeration predicate (e.g., `grep -c '<finding-id-pattern>' <file>`) rather than accepting a narrative count; missing rows propagate to downstream gate mis-grades"
      - "HUMAN-RATIFICATION CHANNEL EXTENSION (v1.4.23; D-970 §Codification 2; human-ratified
  2026-08-10; D-497 parsimony extension to POLICY 22): load-bearing premises in material
  presented for human ratification require literal-shell backing — the same discipline
  that applies to agent-to-agent reporting (POLICY 22 base) applies to the ratification
  channel. A narrative claim that a commit demonstrates property X, without literal-shell
  evidence at that commit, is not authoritative for ratification. Two confirmed instances:
  (1) D-965 ratified ADR-040 §Decision 6 on a false characterisation of commit 5370db80 as
  a stability entry (it was the attestation-provision commit itself — the obligation it was
  presented as satisfying); (2) an orchestrator model-attribution error entered the D-966
  record without a one-line arithmetic division being performed. Detection: orchestrator
  verifies that any human-ratification dispatch includes literal-shell evidence for each
  load-bearing premise; if absent, the dispatch is POLICY 22 HIGH before the human reviews."
